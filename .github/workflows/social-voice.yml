# LEVI'S VOICE LINES FOR SOCIAL VIDEOS
# Levi, 17 Nov 2026: wants his own ElevenLabs voice to introduce the Song of the Night and the
# Scripture Story of the Night posts, and to give the closing invitation.
# Drop a JSON list [{"name": "...", "text": "..."}] into social/requests/<anything>.json and push;
# this job speaks each line in Levi's voice and commits social/voice/<name>.mp3 (+ <name>.json status).
name: Social voice lines
on:
  push:
    paths: ['social/requests/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: social-voice
  cancel-in-progress: false
jobs:
  speak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Speak the lines
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, glob, urllib.request, urllib.error
          key = os.environ.get('ELEVENLABS_API_KEY', '').strip()
          # Levi's own voice, found by its name "Levi" on whichever ElevenLabs account the key belongs to
          # (19 Nov 2026: the account changed, and a voice id belongs to one account), the old clone's id if none.
          VOICE = 'Nz2AS3P86Xwn1ptANiRG'
          try:
              vs = json.load(urllib.request.urlopen(urllib.request.Request('https://api.elevenlabs.io/v1/voices',
                   headers={'xi-api-key': key}), timeout=60)).get('voices') or []
              mine = [v for v in vs if (v.get('name') or '').strip().lower() == 'levi'] or \
                     [v for v in vs if (v.get('name') or '').strip().lower().startswith('levi') and v.get('category') != 'premade']
              if mine: VOICE = mine[0]['voice_id']; print('voice: ' + mine[0]['name'] + ' (' + str(mine[0].get('category')) + ')')
              else: print('no voice named Levi on this account; using the old id')
          except Exception as e:
              print('could not list the voices (' + str(e)[:120] + '); using the old id')
          os.makedirs('social/voice', exist_ok=True)
          for req_file in sorted(glob.glob('social/requests/*.json')):
              for item in json.load(open(req_file)):
                  name, text = item['name'], item['text']
                  mp3, st = f'social/voice/{name}.mp3', f'social/voice/{name}.json'
                  if os.path.exists(st) and json.load(open(st)).get('ok') and json.load(open(st)).get('text') == text and os.path.getsize(mp3) > 0:
                      continue
                  body = json.dumps({'text': text, 'model_id': 'eleven_multilingual_v2',
                      'voice_settings': {'stability': 0.5, 'similarity_boost': 0.8, 'style': 0.15, 'use_speaker_boost': True}}).encode()
                  r = urllib.request.Request(f'https://api.elevenlabs.io/v1/text-to-speech/{VOICE}?output_format=mp3_44100_128',
                      data=body, headers={'xi-api-key': key, 'Content-Type': 'application/json'})
                  try:
                      data = urllib.request.urlopen(r, timeout=120).read()
                      open(mp3, 'wb').write(data)
                      json.dump({'text': text, 'ok': True}, open(st, 'w'))
                      print('made', name)
                  except urllib.error.HTTPError as e:
                      err = e.read()[:400].decode('utf-8', 'replace')
                      json.dump({'text': text, 'ok': False, 'error': f'HTTP {e.code}: {err}'}, open(st, 'w'))
                      print('FAILED', name, e.code, err)
          PY
      - name: Save
        run: |
          git config user.name "Morning Lantern"; git config user.email "lantern-bot@users.noreply.github.com"
          git add social/voice
          git diff --cached --quiet && exit 0
          git commit -m "Social voice lines in Levi's voice"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 10; done; exit 1
