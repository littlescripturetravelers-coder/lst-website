              except Exception as e:
                  print('clean step skipped:',e)
                  if not os.path.exists(f'out/take-{best[1]}.mp3') and os.path.exists(f'out/take-{best[1]}-as-sung.mp3'): os.rename(f'out/take-{best[1]}-as-sung.mp3',f'out/take-{best[1]}.mp3')
          print(f'BEST take {best[1]} with {round(best[2]*100)}% of lines. Listen before publishing.')
          open('out/BEST.txt','w').write(f'take-{best[1]}.mp3 {round(best[2]*100)}%\n')
          # THE WORDS KEEP TIME WITH THE SINGING: the second each line of the best take
          # begins, counted as the app counts the lines (lantern/builder/time_words.py),
          # saved beside the take for the app's own lullaby page.
          try:
              sys.path.insert(0,'lantern/builder'); import time_words as TW
              L2={'chorus':re.sub(r'<[^>]+>','',L.get('chorus','')),
                  'parts':[{'stanzas':[re.sub(r'<[^>]+>','',st) if st!='CHORUS' else 'CHORUS' for st in p['stanzas']]} for p in L['parts']]}
              tlines=[html.unescape(x) for x in TW.lines_of(L2)]
              heard=TW.scribe(f'out/take-{best[1]}.mp3')
              starts,share=TW.align(tlines,heard,None) if heard else (None,0.0)
              if starts and len(starts)==len(tlines):
                  json.dump({'lines':len(tlines),'heard':round(share,3),'timing':starts},open('out/timing.json','w'))
                  print(f'timed the best take: {len(tlines)} lines, {round(share*100)}% of the words found in order')
              else: print('the best take could not be timed (words found: %d%%)' % round(share*100))
          except Exception as e: print('timing skipped:',e)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lullaby-takes
          path: out/
          retention-days: 30
      - name: Push the best take to a branch
        if: ${{ inputs.save_branch != '' }}
        env:
          BR: ${{ inputs.save_branch }}
        run: |
          best=$(cut -d' ' -f1 out/BEST.txt)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BR"
          cp "out/$best" audio/hush-little-traveler-full.mp3
          cp "out/${best%.mp3}-report.txt" lantern/lullaby-full-report.txt
          cp out/plan.json lantern/lullaby-full-plan.json
          [ -f out/timing.json ] && cp out/timing.json lantern/lullaby-full-timing.json
          git add audio/hush-little-traveler-full.mp3 lantern/lullaby-full-report.txt lantern/lullaby-full-plan.json
          [ -f lantern/lullaby-full-timing.json ] && git add lantern/lullaby-full-timing.json
          git -c commit.gpgsign=false commit -qm "The full lullaby: best take from run $GITHUB_RUN_ID"
          git push -f origin "$BR"
          echo "pushed $BR"
