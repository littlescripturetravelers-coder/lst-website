# THE SIGNATURE LULLABY, SUNG IN FULL - run by hand only, never on a schedule.
#
# A Little Travelers' Lullaby has 132 lines; the recording the app plays every
# night (audio/hush-little-traveler.mp3, 4 minutes) sings about a third of them.
# This job asks ElevenLabs Music for the whole song, through the account's own
# lullaby fine-tune (the one the recording came from), with every line of the
# words in order, at the API's longest length (ten minutes). Each take is then
# transcribed and every written line is looked for in what was sung; the best
# take is kept. Nothing is published: the takes and their line-by-line reports
# are attached to the run as artifacts, to be listened to first. Publishing is
# a separate, deliberate step.
#
# It spends ElevenLabs credits (one song's worth per take) and a few cents of
# OpenAI transcription per take. Run it only on Levi's go.
name: lullaby-sing
on:
  workflow_dispatch:
    inputs:
      finetune:
        description: 'Name of the ElevenLabs music fine-tune to sing with'
        required: true
        default: 'Lullaby LST Lantern'
      takes:
        description: 'How many takes to try (the best is kept)'
        required: true
        default: '2'
      length_ms:
        description: 'Song length in milliseconds (the API allows up to 600000)'
        required: true
        default: '600000'
      voice:
        description: 'One line describing the singer, as heard on the current recording'
        required: false
        default: 'One single voice, warm and unhurried, exactly as on the Lantern lullaby'
jobs:
  sing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sing and check
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FINETUNE: ${{ inputs.finetune }}
          TAKES: ${{ inputs.takes }}
          LENGTH_MS: ${{ inputs.length_ms }}
          VOICE: ${{ inputs.voice }}
        run: |
          mkdir -p out
          python3 - <<'PY'
          import os, re, json, sys, time, uuid, difflib, html, urllib.request, urllib.error
          key=os.environ['ELEVENLABS_API_KEY'].strip(); okey=os.environ['OPENAI_API_KEY'].strip()
          want=os.environ['FINETUNE'].strip(); takes=max(1,int(os.environ['TAKES'])); length=min(600000,max(3000,int(os.environ['LENGTH_MS'])))
          voice=os.environ['VOICE'].strip()

          # ── the words, exactly as the app prints them ────────────────────────
          src=open('data/lantern-lullaby.js',encoding='utf8').read()
          m=re.search(r'window\.LST_LANTERN_LULLABY = (\{.*?\n\});',src,re.S).group(1)
          # the file is JavaScript; a tiny node call turns it into JSON
          open('out/obj.js','w').write('const L='+m+';console.log(JSON.stringify(L))')
          import subprocess
          L=json.loads(subprocess.check_output(['node','out/obj.js']).decode())
          sections=[]
          for p in L['parts']:
              lines=[]
              for s in p['stanzas']:
                  t=L['chorus'] if s=='CHORUS' else s
                  t=re.sub(r'<[^>]+>','',t)
                  lines+= [html.unescape(x).strip() for x in t.split('\n') if x.strip()]
              sections.append((p['label'],lines))
          all_lines=[ln for _,ls in sections for ln in ls]
          print('lyrics:',len(all_lines),'lines in',len(sections),'sections')
          lyrics='\n\n'.join('['+lab+']\n'+'\n'.join(ls) for lab,ls in sections)

          # ── the fine-tune, by name ───────────────────────────────────────────
          def api(url,data=None,accept='application/json',ctype='application/json'):
              req=urllib.request.Request(url,data=data,headers={'xi-api-key':key,'accept':accept,**({'content-type':ctype} if data else {})})
              return urllib.request.urlopen(req,timeout=900).read()
          raw=json.loads(api('https://api.elevenlabs.io/v1/music/finetunes'))
          fid=None
          def walk(o):
              global fid
              if isinstance(o,dict):
                  nm=str(o.get('name') or ''); f=o.get('finetune_id') or o.get('id')
                  if f and nm.strip().lower()==want.lower(): fid=f
                  for v in o.values(): walk(v)
              elif isinstance(o,list):
                  for v in o: walk(v)
          walk(raw)
          if not fid: sys.exit('fine-tune not found: '+want)
          print('fine-tune:',want,'->',fid)

          prompt=("A children's bedtime lullaby for Little Scripture Travelers, the same song and the same "
                  "singer as the Lantern lullaby this fine-tune was trained on: "+voice+". Gentle acoustic accompaniment, "
                  "no drums, no percussion, never more than one singer, no backing vocals. Clean and undistorted, "
                  "natural dynamics, plenty of headroom. The song is long on purpose: keep the same slow tempo and the "
                  "same melody all the way through, verse after verse, with the chorus each time it comes, and a soft "
                  "instrumental ending.\n\n"
                  "Sing EXACTLY these lyrics, every line, in this order, nothing added, nothing skipped, nothing repeated "
                  "except where the words repeat. Section names in [brackets] are not sung:\n\n"+lyrics)
          print('prompt is',len(prompt),'characters')

          # ── transcription and the line check ────────────────────────────────
          norm=lambda s: re.sub(r'[^a-z ]','',s.lower().replace('’',"'").replace('traveller','traveler')).strip()
          def transcribe(path):
              data=open(path,'rb').read(); b=uuid.uuid4().hex.encode()
              def part(name,value,filename=None,ct=None):
                  h=b'--'+b+b'\r\nContent-Disposition: form-data; name="'+name.encode()+b'"'
                  if filename: h+=b'; filename="'+filename.encode()+b'"\r\nContent-Type: '+ct.encode()
                  return h+b'\r\n\r\n'+(value if isinstance(value,bytes) else value.encode())+b'\r\n'
              body=(part('model','whisper-1')+part('response_format','verbose_json')+part('language','en')
                    +part('timestamp_granularities[]','segment')
                    +part('prompt',"A children's bedtime lullaby about Heavenly Father, Beau, Scout, Willow and Wren.")
                    +part('file',data,os.path.basename(path),'audio/mpeg')+b'--'+b+b'--\r\n')
              req=urllib.request.Request('https://api.openai.com/v1/audio/transcriptions',data=body,
                  headers={'Authorization':'Bearer '+okey,'Content-Type':'multipart/form-data; boundary='+b.decode()})
              return json.load(urllib.request.urlopen(req,timeout=900))
          def coverage(tr):
              words=norm(' '.join(s['text'] for s in tr.get('segments',[]))).split()
              rows=[]; sung=0
              for lab,ls in sections:
                  for ln in ls:
                      n=norm(ln).split(); best=0
                      if n and words:
                          k=len(n)
                          for i in range(0,max(1,len(words)-k+1)):
                              for kk in (k-1,k,k+1,k+2):
                                  if kk<1: continue
                                  r=difflib.SequenceMatcher(None,' '.join(n),' '.join(words[i:i+kk])).ratio()
                                  if r>best: best=r
                      st='sung' if best>=0.8 else ('close' if best>=0.6 else 'missing')
                      sung+=st=='sung'; rows.append((lab,ln,st,round(best,2)))
              return sung/len(all_lines), rows

          best=None
          for t in range(1,takes+1):
              body={'prompt':prompt[:4900],'music_length_ms':length,'model_id':'music_v1','finetune_id':fid}
              print(f'take {t}: asking ElevenLabs ({length//1000}s)...',flush=True)
              try:
                  audio=api('https://api.elevenlabs.io/v1/music?output_format=mp3_44100_192',data=json.dumps(body).encode(),accept='audio/mpeg')
              except urllib.error.HTTPError as e:
                  detail=e.read()[:600]; print(f'   ElevenLabs refused: HTTP {e.code} {detail!r}')
                  if e.code in (401,402) or b'quota' in detail.lower() or b'credits' in detail.lower(): sys.exit('no credit left; stopping')
                  continue
              path=f'out/take-{t}.mp3'; open(path,'wb').write(audio); print('   got',len(audio),'bytes')
              tr=transcribe(path); dur=tr.get('duration')
              cov,rows=coverage(tr)
              rep=[f'take {t}: {dur and round(dur)}s, {round(cov*100)}% of the {len(all_lines)} lines sung']
              cur=None
              for lab,ln,st,r in rows:
                  if lab!=cur: rep.append('\n## '+lab); cur=lab
                  rep.append(('   ' if st=='sung' else ' ~ ' if st=='close' else ' X ')+ln+f'   ({r})')
              rep.append('\n=== what was heard ===')
              rep+= ['[%6.1f-%6.1f] %s'%(s['start'],s['end'],s['text'].strip()) for s in tr.get('segments',[])]
              open(f'out/take-{t}-report.txt','w').write('\n'.join(rep))
              print(rep[0],flush=True)
              if best is None or cov>best[0]: best=(cov,t)
          if best is None: sys.exit('no take was made')
          print(f'BEST take {best[1]} with {round(best[0]*100)}% of lines. Listen before publishing.')
          open('out/BEST.txt','w').write(f'take-{best[1]}.mp3 {round(best[0]*100)}%\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lullaby-takes
          path: out/
          retention-days: 30
