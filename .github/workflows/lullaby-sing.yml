# THE SIGNATURE LULLABY, SUNG IN FULL - run by hand only, never on a schedule.
#
# A Little Travelers' Lullaby has 132 lines; the first recording the app played
# every night (audio/hush-little-traveler-short.mp3, 4 minutes) sang about a third
# of them; the ten-minute take made from it is what plays now.
# This job asks ElevenLabs Music for the whole song as a composition plan (a
# plain prompt may hold only 4,100 characters, which is why the recording sang
# a third of the words), section by section, every line in order, ten minutes
# in all. To keep the same voice and the same tune, the opening of the current
# recording is uploaded and the plan's first section is taken from it, so the
# rest is sung on from that opening (ElevenLabs calls this inpainting). The
# account's lullaby fine-tune is asked for as well. Each take is transcribed and
# every written line is looked for in what was sung; the best take is kept.
#
# Three modes:
#   check  transcribe and check the takes an earlier run already sang (they are
#          kept as that run's artifact for thirty days), spending no ElevenLabs
#          credit. For a run that sang but fell over before its check - the
#          transcriber answered 429 once, after a take had been paid for.
#   full   sing the whole song (as above).
#   fix    re-sing one stretch of a take and patch it in. ElevenLabs refuses
#          to read the ten-minute take back at all (it calls it copyrighted
#          material, however little of it is asked for), but it accepts the
#          original four-minute recording, whose voice and tune the take was
#          sung on from. So the piece is: twenty seconds of that recording's
#          opening, then the given lines sung again in the same voice. The
#          piece is transcribed to find the new lines, and they are spliced
#          into the take with ffmpeg (a short crossfade at each cut). The
#          whole patched song is then transcribed and checked line by line.
#
# TWO HALVES (parts=2, the default since 2 Oct 2026): Levi wanted it to sound and
# flow like the first recording, made with the "Lullaby LST" fine-tune. That
# recording sings a line every 5.5-6 s with a breath between verses; 132 lines
# at that pace is about fourteen minutes, and ElevenLabs sings ten at most, so a
# single take rushed every line. The song is now sung in two halves at the
# first recording's pace (E major, about 68 BPM, warm and soft), and the best
# matching pair is joined in the breath after a chorus by
# lantern/builder/lullaby_join.py. Uploading a recording to sing on from is
# refused by ElevenLabs as "copyrighted material", so the anchor is off.
#
# Nothing is published by itself: the takes and their line-by-line reports are
# attached to the run as artifacts, and - when save_branch is given - the best
# take is pushed to that branch as audio/hush-little-traveler-full.mp3 with its
# report, to be fetched, listened to and published as a separate step.
#
# It spends ElevenLabs credits (one song's worth per take) and a few cents of
# OpenAI transcription per take. Run it only on Levi's go.
name: lullaby-sing
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = sing the whole song; fix = re-sing one stretch of a take; check = transcribe and check the takes an earlier run sang (no credits spent)'
        type: choice
        options: [full, fix, check, clean]
        default: full
      check_run:
        description: 'check mode: the id of the earlier run whose lullaby-takes artifact holds the takes'
        required: false
        default: ''
      pick:
        description: 'check mode: the take number to keep (blank = the best score); only that take is checked and timed'
        required: false
        default: ''
      finetune:
        description: 'Name of the ElevenLabs music fine-tune to sing with (Lullaby LST made the first recording)'
        required: true
        default: 'Lullaby LST'
      takes:
        description: 'How many takes to try (the best is kept)'
        required: true
        default: '2'
      length_ms:
        description: 'Song length in milliseconds (the API allows up to 600000)'
        required: true
        default: '600000'
      anchor:
        description: 'full mode: start from the current recording (source) or sing fresh (none). ElevenLabs refuses every upload of our recordings as copyrighted, so none'
        required: true
        default: 'none'
      anchor_song:
        description: 'full mode: the ElevenLabs song id of a take to keep the voice of: its opening is kept and the same singer sings on (blank = none)'
        required: false
        default: ''
      anchor_ms:
        description: 'with anchor_song: how much of its opening to keep (ms), ending in the breath before the next line'
        required: false
        default: '24300'
      anchor_lines:
        description: 'with anchor_song: how many lines that opening sings'
        required: false
        default: '4'
      parts:
        description: 'full mode: 2 = sing the song in two halves at the first recording pace and join them in a breath between verses (about 14 minutes); 1 = squeeze it into one ten-minute take'
        required: true
        default: '2'
      sec_per_line:
        description: 'full mode, two halves: seconds per sung line (the first recording sings one about every 5.6 s), plus 3 s of breath between verses'
        required: true
        default: '5.6'
      voice:
        description: 'One line describing the singer, as heard on the current recording'
        required: false
        default: "a woman's voice: a gentle, loving mother softly singing her own child to sleep, tender and warm, close and intimate, unhurried, the same singer from the first note to the last"
      song_id:
        description: 'fix mode: the ElevenLabs song id of the take to keep (blank = upload fix_file, which is what works)'
        required: false
        default: ''
      fix_file:
        description: 'fix mode: the take to patch, a file in this repo'
        required: false
        default: 'audio/hush-little-traveler.mp3'
      fix_from_ms:
        description: 'fix mode: where the stretch to re-sing begins in the take'
        required: false
        default: '373400'
      fix_to_ms:
        description: 'fix mode: where it ends'
        required: false
        default: '387600'
      fix_lines:
        description: 'fix mode: the lines to sing there, separated by " | " (a whole stanza splices cleanest)'
        required: false
        default: "Esther stood courageous and tall, | Though she was frightened by it all. | She chose to speak, she chose what’s right, | And Heavenly Father gave her might."
      sing_as:
        description: 'fix mode: words the singer should say differently from how they are printed, as "Job=Jobe" (comma between pairs); the printed words stay as they are'
        required: false
        default: ''
      save_branch:
        description: 'Push the best take to this branch as audio/hush-little-traveler-full.mp3 (blank = artifact only)'
        required: false
        default: ''
permissions:
  contents: write
  actions: read      # check mode reads an earlier run's artifact
jobs:
  sing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg and numpy, to trim, measure and join takes
        run: |
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq ffmpeg >/dev/null && ffmpeg -version | head -1
          python3 -m pip install --quiet numpy librosa && python3 -c "import numpy, librosa; print('numpy', numpy.__version__, 'librosa', librosa.__version__)"
      - name: The takes an earlier run sang (check mode)
        if: ${{ inputs.mode == 'check' || inputs.mode == 'clean' }}
        uses: actions/download-artifact@v4
        with:
          name: lullaby-takes
          path: out
          run-id: ${{ inputs.check_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sing and check
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODE: ${{ inputs.mode }}
          FINETUNE: ${{ inputs.finetune }}
          TAKES: ${{ inputs.takes }}
          LENGTH_MS: ${{ inputs.length_ms }}
          ANCHOR: ${{ inputs.anchor }}
          VOICE: ${{ inputs.voice }}
          PARTS: ${{ inputs.parts }}
          ANCHOR_SONG: ${{ inputs.anchor_song }}
          ANCHOR_MS_IN: ${{ inputs.anchor_ms }}
          ANCHOR_LINES_IN: ${{ inputs.anchor_lines }}
          SEC_PER_LINE: ${{ inputs.sec_per_line }}
          SONG_ID: ${{ inputs.song_id }}
          FIX_FILE: ${{ inputs.fix_file }}
          FIX_FROM: ${{ inputs.fix_from_ms }}
          FIX_TO: ${{ inputs.fix_to_ms }}
          FIX_LINES: ${{ inputs.fix_lines }}
          SING_AS: ${{ inputs.sing_as }}
          PICK: ${{ inputs.pick }}
        run: |
          mkdir -p out
          python3 - <<'PY'
          import os, re, json, sys, uuid, difflib, html, subprocess, time, glob, urllib.request, urllib.error
          key=os.environ['ELEVENLABS_API_KEY'].strip(); okey=os.environ['OPENAI_API_KEY'].strip()
          mode=os.environ.get('MODE','full').strip().lower()
          want=os.environ['FINETUNE'].strip(); takes=max(1,int(os.environ['TAKES'])); LENGTH=min(600000,max(30000,int(os.environ['LENGTH_MS'])))
          anchor=os.environ.get('ANCHOR','source').strip().lower()=='source'; voice=os.environ['VOICE'].strip()
          PARTS=max(1,min(2,int(os.environ.get('PARTS') or 1))); LINE_S=max(3.0,min(9.0,float(os.environ.get('SEC_PER_LINE') or 5.6))); BREATH_S=3.0
          SOURCE='audio/hush-little-traveler-short.mp3'   # the first, four-minute recording: the voice and tune everything else was sung on from
          # the opening of the current recording that is word-perfect: the first two
          # stanzas, 0:00-0:59 (the third stanza changes a line, so it is re-sung)
          ANCHOR_MS=59000; ANCHOR_LINES=8
          ANCHOR_SONG=os.environ.get('ANCHOR_SONG','').strip()
          if ANCHOR_SONG:
              # Levi, 3 Oct 2026: "I love the voice" - the take he loves is kept for its opening
              # and the same singer sings on from it (ElevenLabs inpainting, from its own song id)
              ANCHOR_MS=int(os.environ.get('ANCHOR_MS_IN') or 24300); ANCHOR_LINES=int(os.environ.get('ANCHOR_LINES_IN') or 4)
          FIX_ID=os.environ.get('SONG_ID','').strip(); FIX_FILE=os.environ.get('FIX_FILE','').strip()
          FIX_FROM=int(os.environ.get('FIX_FROM') or 0); FIX_TO=int(os.environ.get('FIX_TO') or 0)
          FIX_LINES=[x.strip() for x in os.environ.get('FIX_LINES','').split('|') if x.strip()]
          # Levi, 3 Oct 2026: "it says job instead of Job" - the singer is given the name spelled
          # as it is said (Jobe), while the app keeps printing Job
          SING_AS=[tuple(x.split('=',1)) for x in os.environ.get('SING_AS','').split(',') if '=' in x]
          def sung(line):
              for a,b in SING_AS: line=re.sub(r'\b%s\b' % re.escape(a.strip()),b.strip(),line)
              return line
          if mode=='fix': LENGTH=min(LENGTH,599000)   # the API wants strictly under 600 seconds
          CTX=20000   # fix mode: how much of the take is sung along before and after the new lines
          # when the take sings each line (lantern/lullaby-full-lines.json), so a kept stretch can carry its words
          try: TAKE_LINES=json.load(open('lantern/lullaby-full-lines.json',encoding='utf8'))['lines']
          except Exception: TAKE_LINES=[]

          # ── the words, exactly as the app prints them ────────────────────────
          src=open('data/lantern-lullaby.js',encoding='utf8').read()
          m=re.search(r'window\.LST_LANTERN_LULLABY = (\{.*?\n\});',src,re.S).group(1)
          open('out/obj.js','w').write('const L='+m+';console.log(JSON.stringify(L))')
          L=json.loads(subprocess.check_output(['node','out/obj.js']).decode())
          sections=[]
          for p in L['parts']:
              lines=[]
              for s in p['stanzas']:
                  t=L['chorus'] if s=='CHORUS' else s
                  t=re.sub(r'<[^>]+>','',t)
                  lines+=[html.unescape(x).strip() for x in t.split('\n') if x.strip()]
              # a plan section holds at most 30 lines
              while len(lines)>30:
                  sections.append((p['label']+' (first half)',lines[:len(lines)//2])); lines=lines[len(lines)//2:]
                  sections[-1]=(sections[-1][0],sections[-1][1])
              sections.append((p['label'],lines))
          all_lines=[ln for _,ls in sections for ln in ls]
          print('lyrics:',len(all_lines),'lines in',len(sections),'sections')
          if mode=='fix':
              missing=[l for l in FIX_LINES if l not in all_lines]
              if missing: sys.exit('fix mode: these lines are not in the printed words, exactly: %r' % missing)
              if not (0<=FIX_FROM<FIX_TO<=LENGTH): sys.exit('fix mode: the stretch %d-%d is not inside 0-%d' % (FIX_FROM,FIX_TO,LENGTH))
              if not FIX_ID and not FIX_FILE: sys.exit('fix mode: no take to keep (song_id or fix_file)')

          def api(url,data=None,accept='application/json',ctype='application/json',want_headers=False):
              req=urllib.request.Request(url,data=data,headers={'xi-api-key':key,'accept':accept,**({'content-type':ctype} if data and ctype else {})})
              r=urllib.request.urlopen(req,timeout=900); b=r.read()
              return (b,dict(r.headers)) if want_headers else b
          def upload(path):
              # the upload endpoint, like the song, wants strictly under ten minutes: a take of exactly 600 s is trimmed first
              try:
                  cut='out/upload-source.mp3'
                  subprocess.run(['ffmpeg','-y','-loglevel','error','-i',path,'-t',str(LENGTH/1000.0),'-c','copy',cut],check=True)
                  if os.path.getsize(cut)>1000: path=cut; print('   trimmed the file to',LENGTH/1000.0,'s for upload')
              except Exception as e:
                  # no ffmpeg: an mp3 of steady bitrate can be cut by bytes, and a torn last frame is harmless
                  print('   could not trim with ffmpeg:',e)
                  raw=open(path,'rb').read(); keep=int(len(raw)*min(1.0,LENGTH/600000.0)); cut='out/upload-source.mp3'
                  open(cut,'wb').write(raw[:keep]); path=cut; print('   cut the file by bytes to about',LENGTH/1000.0,'s for upload')
              data=open(path,'rb').read(); b=uuid.uuid4().hex.encode()
              def part(name,value,filename=None,ct=None):
                  h=b'--'+b+b'\r\nContent-Disposition: form-data; name="'+name.encode()+b'"'
                  if filename: h+=b'; filename="'+filename.encode()+b'"\r\nContent-Type: '+ct.encode()
                  return h+b'\r\n\r\n'+(value if isinstance(value,bytes) else value.encode())+b'\r\n'
              form=part('file',data,os.path.basename(path),'audio/mpeg')+b'--'+b+b'--\r\n'
              try:
                  up=json.loads(api('https://api.elevenlabs.io/v1/music/upload',data=form,ctype='multipart/form-data; boundary='+b.decode()))
              except urllib.error.HTTPError as e:
                  print('   upload refused: HTTP',e.code,e.read()[:600]); raise
              return up.get('song_id')

          # ── the fine-tune, by name ───────────────────────────────────────────
          raw=json.loads(api('https://api.elevenlabs.io/v1/music/finetunes')) if mode not in ('check','clean') else {}; fid=None
          def walk(o):
              global fid
              if isinstance(o,dict):
                  nm=str(o.get('name') or ''); f=o.get('finetune_id') or o.get('id')
                  if f and nm.strip().lower()==want.lower(): fid=f
                  for v in o.values(): walk(v)
              elif isinstance(o,list):
                  for v in o: walk(v)
          walk(raw)
          print('fine-tune:',want,'->',fid or 'NOT FOUND (singing without it)')

          # ── the anchor: the current recording, uploaded for inpainting ──────
          song_id=None
          if mode=='full' and ANCHOR_SONG:
              song_id=ANCHOR_SONG; print('keeping the voice of song',song_id,'- its first',ANCHOR_MS,'ms',flush=True)
          elif mode=='full' and anchor:
              try:
                  song_id=upload(SOURCE); print('uploaded the current recording: song_id',song_id)
              except urllib.error.HTTPError as e:
                  print('upload refused: HTTP',e.code,e.read()[:500]); print('singing fresh instead')
          if mode=='fix' and not FIX_ID:
              FIX_ID=upload(SOURCE); print('uploaded the original recording, the voice the take was sung on from: song_id',FIX_ID)

          # ── the plan ────────────────────────────────────────────────────────
          # Levi, 2 Oct 2026: "flow and sound just like the first one I had uploaded with the finetune of
          # Lullaby LST ... to put a child to sleep." Measured from that first recording
          # (audio/hush-little-traveler-short.mp3): E major, about 68 beats a minute with a rocking
          # three-to-a-beat sway, half as bright as the ten-minute takes (spectral centroid about
          # 1,200 Hz against 2,300) with twice their share of warm low end, a line every 5.5-6 s and
          # a breath of 3-4 s between verses.
          POS=["a calm instrumental bed of soft piano and warm strings that plays under the voice the whole way through and never stops between lines",
               "lullaby","children's music","Christian","folk","children's bedtime lullaby","a slow, gently rocking lullaby at about 68 BPM, swaying like a cradle","in E major",
               "a major key, warm and comforting, never sad","warm, soft and mellow, cosy, nothing harsh",
               # Levi, 3 Oct 2026: "I only want the mother singing ... add calm instrumental music that matches the singing"
               "one solo singer only, a single voice from the first note to the last: no harmonies, no other voices ever join",
               "calm instrumental accompaniment under the voice all the way through, following its melody and chords: "
               "gentle piano, warm soft strings and a light music-box shimmer, with a warm low end",
               "soft instrumental passages between verses that carry the same melody","no drums, no percussion",
               "clean and undistorted, plenty of headroom","the same slow tempo all the way through",
               "one melody carried through every verse, the chorus the same tune each time it returns",
               "every word sung clearly, exactly as written, nothing added",
               "one continuous, flowing performance: smooth legato phrasing, each line given room to breathe, "
               "a soft instrumental breath of a few seconds between verses, soft and steady dynamics",voice]
          NEG=["drums","percussion","backing vocals","choir","duet","a second singer","a change of singer",
               "a cappella","unaccompanied voice","a sparse arrangement","silence between lines","the music dropping out",
               "harmonies","vocal harmonies","layered vocals","double-tracked vocals","group vocals","children singing","humming chorus","echo voices","distortion","clipping",
               "a man's voice","a male singer","operatic","belting","vibrato-heavy","loudness pushing","shouting","spoken word","rap","improvised words","scat singing","ad-libs","key change","tempo change",
               "rushed phrasing","a fast tempo","harsh tone","busy accompaniment","a minor key","sad","melancholic","dark",
               "abrupt transitions","sudden stops","long silences between verses","a jump in volume","a change of arrangement"]
          if ANCHOR_SONG or mode=='fix': POS=[x for x in POS if x!="in E major"]   # the kept opening sets the key
          def plan_full():
              secs=[]; budget=LENGTH-5000
              rest=[(n,l[:]) for n,l in sections]
              if song_id:
                  first=rest[0]; take=first[1][:ANCHOR_LINES]; rest[0]=(first[0]+' (continued)',first[1][ANCHOR_LINES:])
                  secs.append({'section_name':'Opening, from the recording','positive_local_styles':['exactly as recorded'],'negative_local_styles':[],
                               'duration_ms':ANCHOR_MS,'lines':take,'source_from':{'song_id':song_id,'range':{'start_ms':0,'end_ms':ANCHOR_MS}}})
                  budget-=ANCHOR_MS
              else: budget-=4000
              n=sum(len(l) for _,l in rest); per=budget/float(n)
              for i,(name,lines) in enumerate(rest):
                  if not lines: continue
                  dur=int(len(lines)*per)+(0 if (song_id or i) else 4000)+(5000 if i==len(rest)-1 else 0)
                  dur=max(3000,min(120000,dur))
                  local=['sung softly, one line at a time, every word clear','soft piano and warm strings keep playing under the voice, and carry on between the lines']
                  if name.startswith('Goodnight'): local.append('the chorus: a little fuller, the same tune each time it returns')
                  if i==0 and not song_id: local.append('a short instrumental opening, then the words')
                  if i or song_id: local.append('flows straight on from the section before - the same voice, key, tempo and accompaniment, no pause, no jolt')
                  if i==len(rest)-1: local.append('settling and slowing, almost asleep, a soft instrumental close')
                  secs.append({'section_name':name[:100],'positive_local_styles':local,'negative_local_styles':[],'duration_ms':dur,'lines':lines})
              return {'positive_global_styles':POS,'negative_global_styles':NEG,'sections':secs}
          def plan_fix(sid):
              # the opening of the original recording (its first three lines, word-perfect), then the lines to sing again
              opening=[ln for _,ls in sections for ln in ls][:3]
              secs=[{'section_name':'Opening, from the recording','positive_local_styles':['exactly as recorded'],'negative_local_styles':[],
                     'duration_ms':CTX,'lines':opening,'source_from':{'song_id':sid,'range':{'start_ms':0,'end_ms':CTX}}},
                    {'section_name':'Sung again','positive_local_styles':['sung softly, one line at a time, every word clear, exactly as written',
                     'the same voice, the same tune, the same key and the same slow tempo as the opening, straight on without a pause'],'negative_local_styles':[],
                     'duration_ms':FIX_TO-FIX_FROM+3000,'lines':[sung(l) for l in FIX_LINES]}]
              return {'positive_global_styles':POS,'negative_global_styles':NEG,'sections':secs}
          def splice(take_path,patch_path,out_path):
              # where the piece sings the new lines: found in its own transcription, else where the plan put them
              tr=transcribe(patch_path); ps=None; pe=None
              want=[norm(l) for l in FIX_LINES]
              for sg in tr.get('segments',[]):
                  t=norm(sg['text'])
                  hit=any(difflib.SequenceMatcher(None,w,t).ratio()>=0.6 or (w in t) for w in want)
                  if hit:
                      ps=sg['start'] if ps is None else min(ps,sg['start']); pe=sg['end'] if pe is None else max(pe,sg['end'])
              if ps is None: ps,pe=CTX/1000.0,(CTX+FIX_TO-FIX_FROM)/1000.0
              ps=max(0.0,ps-0.2); pe=pe+0.35
              print('   the new lines sit at %.1f-%.1f s of the piece; heard: %s' % (ps,pe,' / '.join(sg['text'].strip() for sg in tr.get('segments',[]))))
              a=FIX_FROM/1000.0; c=FIX_TO/1000.0
              fc=('[0:a]atrim=0:%.3f,asetpts=PTS-STARTPTS[a];[1:a]atrim=%.3f:%.3f,asetpts=PTS-STARTPTS[b];[0:a]atrim=%.3f,asetpts=PTS-STARTPTS[c];'
                  '[a][b]acrossfade=d=0.15:c1=tri:c2=tri[ab];[ab][c]acrossfade=d=0.15:c1=tri:c2=tri[out]') % (a,ps,pe,c)
              subprocess.run(['ffmpeg','-y','-loglevel','error','-i',take_path,'-i',patch_path,'-filter_complex',fc,'-map','[out]','-b:a','192k',out_path],check=True)
              print('   spliced into the take:',os.path.getsize(out_path),'bytes')
          plan=plan_full() if mode=='full' else plan_fix(FIX_ID)
          total=sum(s['duration_ms'] for s in plan['sections'])
          print(f'plan: {len(plan["sections"])} sections, {sum(len(s["lines"]) for s in plan["sections"])} lines, {total//1000}s')
          if mode in ('full','fix'): json.dump(plan,open('out/plan.json','w'),indent=1)   # check/clean keep the earlier run's plan

          # ── transcription and the line check ────────────────────────────────
          norm=lambda s: re.sub(r'[^a-z ]','',s.lower().replace('’',"'").replace('traveller','traveler')).strip()
          def transcribe(path):
              data=open(path,'rb').read(); b=uuid.uuid4().hex.encode()
              def part(name,value,filename=None,ct=None):
                  h=b'--'+b+b'\r\nContent-Disposition: form-data; name="'+name.encode()+b'"'
                  if filename: h+=b'; filename="'+filename.encode()+b'"\r\nContent-Type: '+ct.encode()
                  return h+b'\r\n\r\n'+(value if isinstance(value,bytes) else value.encode())+b'\r\n'
              body=(part('model','whisper-1')+part('response_format','verbose_json')+part('language','en')
                    +part('timestamp_granularities[]','segment')
                    +part('prompt',"A children's bedtime lullaby about Heavenly Father, Beau, Scout, Willow and Wren.")
                    +part('file',data,os.path.basename(path),'audio/mpeg')+b'--'+b+b'--\r\n')
              req=urllib.request.Request('https://api.openai.com/v1/audio/transcriptions',data=body,
                  headers={'Authorization':'Bearer '+okey,'Content-Type':'multipart/form-data; boundary='+b.decode()})
              # a take has been paid for by now: a busy transcriber is waited out, and when it
              # keeps refusing (on 30 Sept 2026 whisper answered 429 for ten minutes straight while
              # the same key's chat models worked) two other transcribers are asked in turn
              last=None
              for wait in (0,20,45):
                  if wait: print('   transcriber busy; trying again in',wait,'s',flush=True); time.sleep(wait)
                  try: return json.load(urllib.request.urlopen(req,timeout=900))
                  except urllib.error.HTTPError as e:
                      detail=e.read()[:300]; print('   OpenAI whisper: HTTP',e.code,detail,flush=True)
                      if e.code not in (429,500,502,503,504): raise
                      last=e
