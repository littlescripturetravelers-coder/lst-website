# Which voices the ElevenLabs account holds - names, ids and kind only, so a
# narration can be made in the right one (Levi's own voice, if it is there).
# Spends nothing. Press "Run workflow" and read the list in the log.
name: ElevenLabs voices
on:
  workflow_dispatch:
jobs:
  voices:
    runs-on: ubuntu-latest
    steps:
      - name: List the voices
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          key = os.environ.get('ELEVENLABS_API_KEY', '').strip()
          for url in ('https://api.elevenlabs.io/v2/voices?page_size=100&include_total_count=true', 'https://api.elevenlabs.io/v1/voices'):
              try:
                  d = json.load(urllib.request.urlopen(urllib.request.Request(url, headers={'xi-api-key': key}), timeout=60))
              except urllib.error.HTTPError as e:
                  print(url, '-> HTTP', e.code, e.read()[:300].decode('utf-8', 'replace')); continue
              vs = d.get('voices') or []
              print('voices:', len(vs))
              for v in vs:
                  lab = v.get('labels') or {}
                  print('  %-34s | %s | %s | %s' % ((v.get('name') or '')[:34], v.get('voice_id'), v.get('category'),
                        ', '.join('%s=%s' % (k, lab[k]) for k in ('gender', 'age', 'accent', 'use_case', 'descriptive') if lab.get(k))))
              break
          PY
