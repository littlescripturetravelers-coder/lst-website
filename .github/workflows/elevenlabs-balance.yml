# How many ElevenLabs credits are left. Press "Run workflow" and read the numbers
# in the log. The key never leaves the secret store: only counts are printed.
name: ElevenLabs balance
on:
  workflow_dispatch:
jobs:
  balance:
    runs-on: ubuntu-latest
    steps:
      - name: Ask ElevenLabs for the balance
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python3 - <<'EOF'
          import os, json, datetime, urllib.request
          key = os.environ.get('ELEVENLABS_API_KEY', '').strip()
          if not key:
              raise SystemExit('ELEVENLABS_API_KEY is not set in this repository\'s secrets.')
          import urllib.error
          def ask(url):
              req = urllib.request.Request(url, headers={'xi-api-key': key})
              try:
                  return json.load(urllib.request.urlopen(req, timeout=30))
              except urllib.error.HTTPError as e:
                  body = e.read()[:400].decode('utf-8', 'replace')
                  print(f'{url} -> HTTP {e.code}: {body}')
                  return None
          d = ask('https://api.elevenlabs.io/v1/user/subscription')
          if d is None:
              u = ask('https://api.elevenlabs.io/v1/user')
              d = (u or {}).get('subscription') or {}
          if not d:
              # not a failure: this key is allowed to make music but not to read the account,
              # and the balance can be seen in the ElevenLabs app (profile > credits)
              print('This key is not allowed to read the balance (that is fine - it can still make music).')
              print('To see the balance: open the ElevenLabs app, tap your profile; the credits are under your email.')
              print('To let this job read it: ElevenLabs > Developers > API Keys > edit this key > turn on "User" read.')
              raise SystemExit(0)
          used = int(d.get('character_count') or 0); limit = int(d.get('character_limit') or 0)
          reset = d.get('next_character_count_reset_unix')
          print('plan:            ', d.get('tier'))
          print('credit limit:    ', limit)
          print('credits used:    ', used)
          print('credits left:    ', limit - used)
          print('cycle resets:    ', datetime.datetime.utcfromtimestamp(reset).strftime('%Y-%m-%d %H:%M UTC') if reset else 'unknown')
          EOF
