# Morning Lantern — Drive → GitHub sync + ElevenLabs lullaby (free GitHub Actions; the only secret lives in GitHub)
# File location:  .github/workflows/lantern-sync.yml  in the lst-website repo.
#
# 1. Copies any new .html / .json file from the public Drive folder "Lantern Publish" into DEST
#    (DEST is "lantern" at the top of the repo - see the warning beside it; it must never be under "public").
#    Drive name  a-lamp-for-my-feet__morning-lantern-lds.html  ->  DEST/a-lamp-for-my-feet/morning-lantern-lds.html
# 2. For every  DEST/<slug>/lullaby.json  that has no  DEST/<slug>/<slug>-lullaby.mp3  yet, asks ElevenLabs Music
#    (finetune "LST Theme Music") to sing the lyrics, and saves the MP3 beside the lullaby page.
#
# Repo secret needed (Settings → Secrets and variables → Actions):
#   ELEVENLABS_API_KEY   your ElevenLabs API key
# The finetune is found by name (FINETUNE_NAME below) via GET /v1/music/finetunes — no ID to look up.

name: Lantern sync

on:
  schedule:
    - cron: '*/30 * * * *'      # every 30 minutes (UTC)
  workflow_dispatch:            # lets you press "Run workflow" by hand
  push:                         # a night pushed straight into lantern/ publishes within a minute
    paths: ['lantern/**']       # (the Action's own commits use GITHUB_TOKEN and do not re-trigger this)

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download any new Lantern files from the Drive folder
        env:
          FOLDER_ID: 1C5Xk6kEFo7gbyPaQs9Rh9ojkNjxg_rZQ     # "Lantern Publish" folder (must be shared: Anyone with the link)
          DEST: lantern                                   # folder in this repo where Lantern HTML files live
          # ⚠️ NEVER set DEST to public/anything. This website is plain HTML served
          # straight from the top of the repo. Vercel has a rule for repos like this:
          # if a folder called "public" exists at the top level, it treats THAT as the
          # whole website and serves nothing else. On 5 Sep 2026 this line said
          # "public/lantern", the folder appeared, and littlescripturetravelers.com
          # answered "404: NOT_FOUND" for three days. Keep it out of "public".
        run: |
          set -e
          python3 - <<'EOF'
          import os, re, html, urllib.request
          folder = os.environ['FOLDER_ID']; dest = os.environ['DEST']
          UA = {'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'}
          def get(url):
              return urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=60).read()
          page = get(f"https://drive.google.com/embeddedfolderview?id={folder}#list").decode('utf-8', 'ignore')
          if 'accounts.google.com' in page[:2000] or 'ServiceLogin' in page[:2000]:
              raise SystemExit("Google asked for a sign-in: the 'Lantern Publish' folder is not shared as 'Anyone with the link'.")
          entries = re.findall(r'id="entry-([\w-]+)".*?class="flip-entry-title">(.*?)</div>', page, re.S)
          print(f'{len(entries)} item(s) listed in the Drive folder')
          added = 0
          for fid, raw_name in entries:
              name = html.unescape(raw_name).strip()
              if not (name.endswith('.html') or name.endswith('.json')):
                  print('skipping:', name); continue
              rel = name.replace('__', '/')            # slug__file.html -> slug/file.html
              path = os.path.join(dest, rel)
              if os.path.exists(path):
                  continue
              data = get(f"https://drive.google.com/uc?export=download&id={fid}")
              if name.endswith('.html') and b'<!DOCTYPE html>' not in data[:300]:
                  raise SystemExit(f"Download of {name} did not look like a Lantern page - check its sharing setting.")
              if name.endswith('.json') and not data.lstrip().startswith(b'{'):
                  raise SystemExit(f"Download of {name} did not look like JSON - check its sharing setting.")
              os.makedirs(os.path.dirname(path), exist_ok=True)
              open(path, 'wb').write(data)
              print('added', path); added += 1
          print(f'{added} new file(s)')
          EOF

      - name: Sing any lullaby that has no MP3 yet (ElevenLabs Music)
        env:
          DEST: lantern
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          FINETUNE_NAME: LST Theme Music
        run: |
          set -e
          python3 - <<'EOF'
          import os, json, glob, urllib.request
          dest = os.environ['DEST']
          key = os.environ.get('ELEVENLABS_API_KEY', '').strip()
          want = os.environ.get('FINETUNE_NAME', '').strip()
          todo = [p for p in glob.glob(f'{dest}/*/lullaby.json')
                  if not os.path.exists(os.path.join(os.path.dirname(p), os.path.basename(os.path.dirname(p)) + '-lullaby.mp3'))]
          if not todo:
              print('No lullabies waiting for audio.'); raise SystemExit(0)
          if not key:
              print(f'{len(todo)} lullaby(ies) waiting, but ELEVENLABS_API_KEY is not set - skipping audio for now.'); raise SystemExit(0)
          def api(url, data=None, accept='application/json'):
              req = urllib.request.Request(url, data=data, headers={'xi-api-key': key, 'Content-Type': 'application/json', 'Accept': accept})
              return urllib.request.urlopen(req, timeout=600).read()
          # find the finetune id by name
          finetune = ''
          if want:
              try:
                  raw = json.loads(api('https://api.elevenlabs.io/v1/music/finetunes'))
              except urllib.error.HTTPError as e:
                  raise SystemExit(f"Could not list ElevenLabs finetunes: HTTP {e.code} {e.read()[:300]!r}")
              def walk(o):
                  if isinstance(o, dict):
                      name = str(o.get('name') or o.get('title') or '')
                      fid = o.get('finetune_id') or o.get('id')
                      if fid and name.strip().lower() == want.lower():
                          return fid
                      for v in o.values():
                          r = walk(v)
                          if r: return r
                  elif isinstance(o, list):
                      for v in o:
                          r = walk(v)
                          if r: return r
              finetune = walk(raw) or ''
              print('finetune:', want, '->', finetune or 'NOT FOUND (will generate without it)')
          for p in todo:
              slug = os.path.basename(os.path.dirname(p))
              meta = json.load(open(p, encoding='utf-8'))
              prompt = meta.get('prompt', '').strip() + "\n\nSing exactly these lyrics, one voice only:\n\n" + meta['lyrics'].strip()
              body = {'prompt': prompt[:4100], 'music_length_ms': int(meta.get('length_ms', 120000)), 'model_id': 'music_v1'}
              if finetune:
                  body['finetune_id'] = finetune
              try:
                  audio = api('https://api.elevenlabs.io/v1/music?output_format=mp3_44100_128',
                              data=json.dumps(body).encode('utf-8'), accept='audio/mpeg')
              except urllib.error.HTTPError as e:
                  raise SystemExit(f"ElevenLabs refused {slug}: HTTP {e.code} {e.read()[:500]!r}")
              out = os.path.join(os.path.dirname(p), f'{slug}-lullaby.mp3')
              open(out, 'wb').write(audio)
              print(f'sang {slug}: {len(audio)//1024} KB -> {out}')
          EOF

      # 3. Put every finished night into the account - the paste Levi used to do by
      #    hand in Admin, every night. Reads lantern/<slug>/night.json and the files
      #    beside it, upserts daily_content on publish_date exactly as Admin does, then
      #    asks the narrate function to record the voices. Publishes each folder once
      #    per change (fingerprint in .published.json, committed below).
      #    Repo secret needed:  SUPABASE_SERVICE_ROLE_KEY   (Supabase > Project Settings > API)
      #    Without it the step explains and does nothing - it never fails the run.
      - name: Publish any finished night to the account (Supabase)
        # Pillow re-encodes a book's photographs on the way to the account. Without
        # it the publisher says so and sends the book at full size, so a bad install
        # day costs picture weight, never the night.
        env:
          DEST: lantern
          SUPABASE_URL: https://rdbvktqgrwhjucocobua.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_BASE: https://littlescripturetravelers.com
          APP_BASE: https://app.littlescripturetravelers.com
        run: |
          python3 -m pip install --quiet --disable-pip-version-check Pillow || \
            echo "Pillow would not install - books go at full size."
          python3 lantern/publish_to_supabase.py

      - name: Commit and push
        run: |
          git config user.name  "lantern-bot"
          git config user.email "lantern-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
          else
            git commit -m "Morning Lantern: sync $(date -u +%Y-%m-%d)"
            git push
          fi
