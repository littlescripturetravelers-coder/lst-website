# Morning Lantern — Drive → GitHub sync + ElevenLabs lullaby (free GitHub Actions; the only secret lives in GitHub)
# File location:  .github/workflows/lantern-sync.yml  in the lst-website repo.
#
# 1. Copies any new .html / .json file from the public Drive folder "Lantern Publish" into DEST
#    (DEST is "lantern" at the top of the repo - see the warning beside it; it must never be under "public").
#    Drive name  a-lamp-for-my-feet__morning-lantern-lds.html  ->  DEST/a-lamp-for-my-feet/morning-lantern-lds.html
# 2. For every  DEST/<slug>/lullaby.json  that has no  DEST/<slug>/<slug>-lullaby.mp3  yet, asks ElevenLabs Music
#    to compose and sing the lyrics fresh for that night, and saves the MP3 beside the lullaby page.
#
# Repo secret needed (Settings → Secrets and variables → Actions):
#   ELEVENLABS_API_KEY   your ElevenLabs API key
# No finetune is used (FINETUNE_NAME is blank): the "LST Theme Music" finetune sang every night as
# the same song in the same voice. The brand lives in the SPINE text of the request instead.

name: Lantern sync

on:
  schedule:
    - cron: '*/30 * * * *'      # every 30 minutes (UTC)
  workflow_dispatch:            # lets you press "Run workflow" by hand
    inputs:
      time_slugs:
        description: "Time the words of these songs again (slugs, comma-separated) - ElevenLabs Scribe, a few cents each"
        required: false
        default: ""
  push:                         # a night pushed straight into lantern/ publishes within a minute
    branches: [main]            # main only: a night is published from what is merged, never from a
    paths: ['lantern/**']       # working branch (the Action's own commits use GITHUB_TOKEN and do
                                # not re-trigger this)

permissions:
  contents: write

# ONE RUN AT A TIME. A push run and a scheduled run overlapping sang the same
# lullaby twice and the later push was rejected (14 Sept, run 133). Runs queue.
concurrency:
  group: lantern-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # A stuck step holds the queue (one run at a time), so no run may outlive the next nights' needs.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Download any new Lantern files from the Drive folder
        env:
          FOLDER_ID: 1C5Xk6kEFo7gbyPaQs9Rh9ojkNjxg_rZQ     # "Lantern Publish" folder (must be shared: Anyone with the link)
          DEST: lantern                                   # folder in this repo where Lantern HTML files live
          # ⚠️ NEVER set DEST to public/anything. This website is plain HTML served
          # straight from the top of the repo. Vercel has a rule for repos like this:
          # if a folder called "public" exists at the top level, it treats THAT as the
          # whole website and serves nothing else. On 5 Sep 2026 this line said
          # "public/lantern", the folder appeared, and littlescripturetravelers.com
          # answered "404: NOT_FOUND" for three days. Keep it out of "public".
        run: |
          set -e
          python3 - <<'EOF'
          import os, re, html, urllib.request
          folder = os.environ['FOLDER_ID']; dest = os.environ['DEST']
          UA = {'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'}
          def get(url):
              return urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=60).read()
          page = get(f"https://drive.google.com/embeddedfolderview?id={folder}#list").decode('utf-8', 'ignore')
          if 'accounts.google.com' in page[:2000] or 'ServiceLogin' in page[:2000]:
              raise SystemExit("Google asked for a sign-in: the 'Lantern Publish' folder is not shared as 'Anyone with the link'.")
          entries = re.findall(r'id="entry-([\w-]+)".*?class="flip-entry-title">(.*?)</div>', page, re.S)
          print(f'{len(entries)} item(s) listed in the Drive folder')
          added = 0
          for fid, raw_name in entries:
              name = html.unescape(raw_name).strip()
              if not (name.endswith('.html') or name.endswith('.json')):
                  print('skipping:', name); continue
              rel = name.replace('__', '/')            # slug__file.html -> slug/file.html
              path = os.path.join(dest, rel)
              if os.path.exists(path):
                  continue
              data = get(f"https://drive.google.com/uc?export=download&id={fid}")
              if name.endswith('.html') and b'<!DOCTYPE html>' not in data[:300]:
                  raise SystemExit(f"Download of {name} did not look like a Lantern page - check its sharing setting.")
              if name.endswith('.json') and not data.lstrip().startswith(b'{'):
                  raise SystemExit(f"Download of {name} did not look like JSON - check its sharing setting.")
              os.makedirs(os.path.dirname(path), exist_ok=True)
              open(path, 'wb').write(data)
              print('added', path); added += 1
          print(f'{added} new file(s)')
          EOF

      # The take-measuring below needs ffmpeg, and the runner image does not
      # always ship it. Without it every take was kept unmeasured (15 Sept, run
      # 147), so it is put in place here, before a single song is asked for.
      - name: Make sure ffmpeg is here before any song is measured
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            # A clock on each: on 7 Oct 2026 apt hung here for forty minutes, and every run queued
            # behind it - the night's sync included. Better a take kept unmeasured than no night.
            timeout 180 sudo apt-get -qq update >/dev/null 2>&1 || true
            timeout 300 sudo apt-get -qq install -y ffmpeg >/dev/null 2>&1 || echo "could not install ffmpeg - takes will be kept unmeasured"
          fi
          command -v ffmpeg >/dev/null 2>&1 && ffmpeg -version | head -1 || true

      - name: Sing any lullaby that has no MP3 yet (ElevenLabs Music)
        # The words change every night and always have. The music did not: every
        # lullaby.json carried the same sentence of direction, so every night came
        # back the same tune. The direction now has two parts - a spine that never
        # changes, so a song is recognisably ours, and the night's own colour, which
        # is whatever the build wrote for this story. Nothing else moves.
        #
        # Every take is measured before it is kept. ElevenLabs occasionally returns
        # something clipped, near-silent, or the wrong length, and none of that is
        # audible to the machine that saved it - so it is measured instead: samples
        # pinned at full scale (that is distortion), average level, and duration.
        # A take that fails is asked for again. A night ends up with a clean song or
        # no song, never a broken one.
        env:
          DEST: lantern
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}   # reads each take back, to check the words (THE WORDS RULE)
          FINETUNE_NAME: ""   # left blank on purpose - see the note beside the request
        run: |
          set -e
          python3 - <<'EOF'
          import os, json, glob, subprocess, tempfile, urllib.request, urllib.error
          dest = os.environ['DEST']
          key = os.environ.get('ELEVENLABS_API_KEY', '').strip()
          want = os.environ.get('FINETUNE_NAME', '').strip()

          # The part of the direction that is the brand. A Little Scripture Travelers
          # lullaby is one voice, gently played, sung to a child who is nearly asleep,
          # and recorded cleanly. Written here rather than in a night so that a night
          # cannot quietly stop sounding like us.
          SPINE = ("A children's bedtime lullaby for Little Scripture Travelers. "
                   "{voice}, warm and unhurried, singing to a child who is "
                   "almost asleep. {style}. No drums, no percussion. "
                   "Clean and undistorted: natural dynamics, no clipping, no loudness "
                   "pushing, plenty of headroom, no harshness on the voice. "
                   "Never more than one singer, and no backing vocals. "
                   "Compose a new, original melody for these lyrics - not a reprise of any "
                   "earlier song - in a key, tempo and meter that suit the words and the "
                   "direction below.")

          # THE VARIETY RULE. The brand is the spine above; the SINGER and the
          # ARRANGEMENT change from night to night, chosen to match the story's
          # feeling, from these two palettes and no others (so a night can be
          # different without stepping outside the brand). A night's lullaby.json
          # may name its own `voice` and `style` (the builder writes them from the
          # story); otherwise they are read from the mood's own words, and failing
          # that rotated by the date so two nights in a row never sound alike.
          VOICES = {
              "mother":   "One single voice: a mother's soft alto, close and hushed",
              "father":   "One single voice: a father's low, gentle baritone, almost a hum",
              "soprano":  "One single voice: a light, clear soprano, sweet and airy",
              "tenor":    "One single voice: a young man's soft tenor, tender and plain",
              "grandma":  "One single voice: an older woman's warm, weathered alto, unhurried",
              "whisper":  "One single voice: a breathy half-whisper, barely above the strings",
          }
          STYLES = {
              "guitar":   "Gentle acoustic accompaniment: fingerpicked nylon guitar with a low sustained warmth underneath",
              "piano":    "Gentle acoustic accompaniment: soft felt piano, slow rolling chords, light strings far back",
              "harp":     "Gentle acoustic accompaniment: a small celtic harp, plucked slowly, a cello holding long notes",
              "musicbox": "Gentle acoustic accompaniment: a music-box waltz in three, glockenspiel and soft strings",
              "ukulele":  "Gentle acoustic accompaniment: a softly strummed ukulele and a quiet upright bass",
              "hymn":     "Gentle acoustic accompaniment: a hymn-like piano with a warm, faint organ pad and strings",
              "cello":    "Gentle acoustic accompaniment: a cello and a fingerpicked guitar in slow conversation",
              "strings":  "Gentle acoustic accompaniment: a small string quartet, soft and slow, nothing else",
          }
          # words in a mood that point to a palette entry (the first hit wins)
          VOICE_HINTS = [("father|dad|deep|low voice|baritone", "father"), ("grandma|grandmother|older|weathered", "grandma"),
                         ("whisper|breath|hush", "whisper"), ("bright|light|airy|soprano|high", "soprano"),
                         ("tenor|young man", "tenor"), ("mother|mom|alto", "mother")]
          STYLE_HINTS = [("harp|celtic|pluck", "harp"), ("music box|music-box|waltz|glocken", "musicbox"), ("ukulele|strum", "ukulele"),
                         ("hymn|organ|chapel|reverent|worship", "hymn"), ("cello", "cello"), ("string|quartet|violin", "strings"),
                         ("piano|keys", "piano"), ("guitar|fingerpick|folk|walking|step", "guitar")]
          import re, hashlib
          def choose(meta, slug):
              mood = (meta.get('mood') or '').lower()
              v = meta.get('voice'); st = meta.get('style')
              if v not in VOICES:
                  v = next((k for pat, k in VOICE_HINTS if re.search(pat, mood)), None)
              if st not in STYLES:
                  st = next((k for pat, k in STYLE_HINTS if re.search(pat, mood)), None)
              h = int(hashlib.md5(slug.encode()).hexdigest(), 16)
              if v is None:  v = list(VOICES)[h % len(VOICES)]
              if st is None: st = list(STYLES)[(h // 7) % len(STYLES)]
              return v, st

          todo = [p for p in glob.glob(f'{dest}/*/lullaby.json')
                  if not os.path.exists(os.path.join(os.path.dirname(p), os.path.basename(os.path.dirname(p)) + '-lullaby.mp3'))]
          if not todo:
              print('No lullabies waiting for audio.'); raise SystemExit(0)
          if not key:
              print(f'{len(todo)} lullaby(ies) waiting, but ELEVENLABS_API_KEY is not set - skipping audio for now.'); raise SystemExit(0)
          # THE QUEUE RULE. Tonight's song first, always; then the story lullabies
          # (lantern/build_story_lullabies.py) in book order, June before July. A
          # run sings at most MAX_PER_RUN and stops, so a long queue is worked
          # through by the half-hourly runs a couple of dozen at a time, and each
          # run's songs are committed before the next begins - a queue of ninety
          # in one run would have risked the whole batch on one hiccup.
          BOOK_NO = {'june':6,'july':7,'august':8,'september':9,'october':10,'november':11,'december':12}
          def order(p):
              try: m = json.load(open(p, encoding='utf-8'))
              except Exception: m = {}
              book = m.get('book') or ''
              return (1 if book else 0, BOOK_NO.get(book, 99), int(m.get('storyNumber') or 0), p)
          todo.sort(key=order)
          MAX_PER_RUN = int(os.environ.get('MAX_PER_RUN', '24'))
          if len(todo) > MAX_PER_RUN:
              print(f'{len(todo)} lullabies waiting; singing the first {MAX_PER_RUN} this run, the rest on the next runs.')
              todo = todo[:MAX_PER_RUN]

          def api(url, data=None, accept='application/json'):
              req = urllib.request.Request(url, data=data, headers={'xi-api-key': key, 'Content-Type': 'application/json', 'Accept': accept})
              return urllib.request.urlopen(req, timeout=600).read()

          have_ffmpeg = True
          try:
              subprocess.run(['ffmpeg', '-version'], capture_output=True, check=True)
          except Exception:
              have_ffmpeg = False
              print('ffmpeg is not here - a take will be kept without being measured.')

          def measure(path, want_ms):
              """What is objectively wrong with this take, as a list of sentences.

              volumedetect counts samples sitting exactly at full scale. That is
              what distortion is: the waveform hitting the ceiling and being
              flattened. A handful is nothing; thousands is a ruined song."""
              if not have_ffmpeg:
                  return [], {}
              r = subprocess.run(['ffmpeg', '-hide_banner', '-i', path, '-af', 'volumedetect', '-f', 'null', '-'],
                                 capture_output=True, text=True)
              out = r.stderr
              def num(tag, cast=float):
                  for line in out.splitlines():
                      if tag in line:
                          try: return cast(line.split(tag)[1].split()[0])
                          except Exception: return None
                  return None
              peak = num('max_volume:'); mean = num('mean_volume:')
              clipped = num('histogram_0db:', int) or 0
              secs = None
              try:
                  pr = subprocess.run(['ffprobe', '-v', 'error', '-show_entries', 'format=duration',
                                       '-of', 'default=nw=1:nk=1', path], capture_output=True, text=True)
                  secs = float(pr.stdout.strip())
              except Exception:
                  pass
              facts = {'peak_db': peak, 'mean_db': mean, 'clipped_samples': clipped, 'seconds': secs}
              bad = []
              if clipped > 2000:
                  bad.append(f'{clipped} samples pinned at full scale - that is audible distortion')
              if mean is not None and mean < -40:
                  bad.append(f'almost silent (average {mean} dB)')
              if peak is not None and peak < -25:
                  bad.append(f'far too quiet to hear at bedtime (peak {peak} dB)')
              if secs is not None and want_ms and secs < (want_ms / 1000.0) * 0.4:
                  bad.append(f'only {secs:.0f}s of a song that should run {want_ms // 1000}s')
              return bad, facts

          # find the finetune id by name
          finetune = ''
          if want:
              try:
                  raw = json.loads(api('https://api.elevenlabs.io/v1/music/finetunes'))
              except urllib.error.HTTPError as e:
                  raise SystemExit(f"Could not list ElevenLabs finetunes: HTTP {e.code} {e.read()[:300]!r}")
              def walk(o):
                  if isinstance(o, dict):
                      name = str(o.get('name') or o.get('title') or '')
                      fid = o.get('finetune_id') or o.get('id')
                      if fid and name.strip().lower() == want.lower():
                          return fid
                      for v in o.values():
                          r = walk(v)
                          if r: return r
                  elif isinstance(o, list):
                      for v in o:
                          r = walk(v)
                          if r: return r
              finetune = walk(raw) or ''
              print('finetune:', want, '->', finetune or 'NOT FOUND (will generate without it)')

          # ── THE WORDS RULE ─────────────────────────────────────────────────
          # The words a family reads on the page must be the words they hear.
          # One prompt lets the singer drop a verse or reshape a line, and a
          # two-minute clock for thirty-two lines makes that certain. So the
          # song is asked for as a PLAN, section by section - every [Verse] and
          # [Chorus] of the page with its own lines and its own share of time -
          # and every take is read back by a transcriber and held against the
          # page. A take that sings less than most of the lines is asked for
          # again, and the best of the takes is kept, with its score in the log.
          import re, difflib, uuid
          PER_LINE_MS = int(os.environ.get('PER_LINE_MS', '5500'))   # a sung line of common metre, unhurried
          INTRO_MS, OUTRO_MS, MAX_SONG_MS = 4000, 5000, 240000
          FIT_KEEP = float(os.environ.get('FIT_KEEP', '0.78'))        # the share of lines that must be heard
          oa_key = os.environ.get('OPENAI_API_KEY', '').strip()
          SPINE_STYLE = ["children's bedtime lullaby", "one single voice, no second singer", "warm and unhurried",
                         "gentle acoustic accompaniment", "no drums, no percussion", "clean and undistorted, plenty of headroom",
                         "a new, original melody that suits the words", "every word sung clearly, exactly as written"]
          NEG_STYLE = ["drums", "percussion", "backing vocals", "choir", "duet", "distortion", "clipping",
                       "loudness pushing", "shouting", "spoken word", "rap", "improvised words", "scat singing", "ad-libs"]

          def sections_of(lyrics):
              """[Verse n] / [Chorus] blocks -> [(name, lines)]; an empty [Chorus] repeats the first one's words."""
              out, chorus, nc = [], None, 0
              for block in lyrics.strip().replace('\r', '').split('\n\n'):
                  rows = [l.strip() for l in block.strip().split('\n') if l.strip()]
                  if not rows: continue
                  name = rows[0].strip('[]').strip() if rows[0].startswith('[') else ''
                  body = rows[1:] if name else rows
                  if name.lower().startswith('chorus'):
                      nc += 1
                      if body: chorus = body
                      elif chorus: body = chorus
                      name = 'Chorus' if nc == 1 else f'Chorus {nc}'
                  if not body: continue
                  out.append((name or f'Verse {len(out) + 1}', body))
              return out

          def plan_for(meta, v, st, colour):
              """The song as sections, each with the page's own lines and its share of the time."""
              secs = sections_of(meta['lyrics'])
              if not secs: return None, 0
              n = sum(len(b) for _, b in secs)
              scale = min(1.0, (MAX_SONG_MS - INTRO_MS - OUTRO_MS) / float(n * PER_LINE_MS))
              sections, total = [], 0
              for i, (name, lines) in enumerate(secs):
                  dur = int(len(lines) * PER_LINE_MS * scale) + (INTRO_MS if i == 0 else 0) + (OUTRO_MS if i == len(secs) - 1 else 0)
                  local = ['sung softly, one line at a time, every word clear']
                  if name.startswith('Chorus'): local.append('the chorus: a little fuller, the same tune each time it returns')
                  if i == 0: local.append('a short instrumental opening, then the words')
                  if i == len(secs) - 1: local.append('settling and slowing, almost asleep, a soft instrumental close')
                  sections.append({'section_name': name, 'positive_local_styles': local, 'negative_local_styles': [],
                                   'duration_ms': dur, 'lines': lines})
                  total += dur
              plan = {'positive_global_styles': SPINE_STYLE + [VOICES[v], STYLES[st]] + ([colour] if colour else []),
                      'negative_global_styles': NEG_STYLE, 'sections': sections}
              return plan, total

          def heard(path):
              """The words in a take as a transcriber hears them, or None when it cannot be asked."""
              if not oa_key: return None
              bd = uuid.uuid4().hex; data = open(path, 'rb').read()
              body = ((f'--{bd}\r\nContent-Disposition: form-data; name="model"\r\n\r\nwhisper-1\r\n'
                       f'--{bd}\r\nContent-Disposition: form-data; name="response_format"\r\n\r\ntext\r\n'
                       f'--{bd}\r\nContent-Disposition: form-data; name="language"\r\n\r\nen\r\n'
                       f'--{bd}\r\nContent-Disposition: form-data; name="temperature"\r\n\r\n0\r\n'
                       f'--{bd}\r\nContent-Disposition: form-data; name="file"; filename="song.mp3"\r\nContent-Type: audio/mpeg\r\n\r\n').encode('utf-8')
                      + data + f'\r\n--{bd}--\r\n'.encode('utf-8'))
              req = urllib.request.Request('https://api.openai.com/v1/audio/transcriptions', data=body,
                                           headers={'Authorization': 'Bearer ' + oa_key, 'Content-Type': f'multipart/form-data; boundary={bd}'})
              try:
                  return urllib.request.urlopen(req, timeout=300).read().decode('utf-8', 'replace')
              except Exception as e:
                  print(f'    could not read the take back ({str(e)[:120]}); its words go unchecked'); return None

          def words(s): return re.findall(r"[a-z']+", s.lower().replace('’', "'"))
          def fit(lyrics, text):
              """The share of the page's lines heard in the take, and the lines that were not."""
              sung = words(text); lines = [l for _, body in sections_of(lyrics) for l in body]
              hit, missing = 0, []
              for l in lines:
                  w = words(l)
                  if not w: continue
                  n = len(w); best = 0.0
                  for i in range(0, max(1, len(sung) - n + 1)):
                      r = difflib.SequenceMatcher(None, w, sung[i:i + n + 1]).ratio()
                      if r > best: best = r
                      if best >= 0.95: break
                  if best >= 0.6: hit += 1
                  else: missing.append(l)
              return (hit / float(len(lines)) if lines else 1.0), missing

          ATTEMPTS = 3
          refused = []
          plan_refused = False   # the service turned the plan down once: the prompt carries the rest of the run
          for p in todo:
              slug = os.path.basename(os.path.dirname(p))
              meta = json.load(open(p, encoding='utf-8'))
              # The night's own colour. `mood` is the new key and is what the build
              # should write; `prompt` is still read so an older night still sings.
              colour = (meta.get('mood') or meta.get('prompt') or '').strip()
              v, st = choose(meta, os.path.basename(os.path.dirname(p)))
              print(f'  singer: {v} - arrangement: {st}')
              plan, plan_ms = plan_for(meta, v, st, colour)
              # the page's lines decide the length now; lullaby.json's length_ms is a floor for the old road only
              length = max(int(meta.get('length_ms', 120000)), plan_ms or 0)
              length = min(length, MAX_SONG_MS)
              prompt = (SPINE.format(voice=VOICES[v], style=STYLES[st]) + ('\n\n' + colour if colour else '') +
                        "\n\nSing exactly these lyrics, every line, in this order, one voice only:\n\n" + meta['lyrics'].strip())
              print(f'{slug}: {("colour: " + colour[:80]) if colour else "no colour written for this night - spine only"}')
              if plan: print(f'    plan: {len(plan["sections"])} sections, {sum(len(x["lines"]) for x in plan["sections"])} lines, {plan_ms // 1000}s')

              best = None   # (how many things are wrong, -fit, bytes, facts, reasons)
              for attempt in range(1, ATTEMPTS + 1):
                  use_plan = bool(plan) and not plan_refused
                  if use_plan:
                      body = {'composition_plan': plan, 'model_id': 'music_v1'}
                  else:
                      body = {'prompt': prompt[:4100], 'music_length_ms': length, 'model_id': 'music_v1'}
                  # No finetune. "LST Theme Music" was trained on one song, so every night
                  # came back as that song in that voice, whatever the prompt asked for.
                  # The brand is the SPINE above; the tune and the singer are the night's.
                  try:
                      audio = api('https://api.elevenlabs.io/v1/music?output_format=mp3_44100_128',
                                  data=json.dumps(body).encode('utf-8'), accept='audio/mpeg')
                  except urllib.error.HTTPError as e:
                      detail = e.read()[:500]
                      if use_plan and e.code in (400, 422):
                          # The plan was not understood. Say so plainly - it is the thing to
                          # look at - and ask again the old way, with the page's own length.
                          print(f"    the plan was refused (HTTP {e.code} {detail!r}); asking with the prompt instead, {length // 1000}s")
                          plan_refused = True
                          continue
                      # One refusal must not stop the queue behind it (a night's words
                      # ElevenLabs will not sing, a moment's overload). Say so, keep
                      # going; the song is asked for again on the next run. An empty
                      # account is different: nothing after it can succeed either.
                      print(f"    ElevenLabs refused {slug}: HTTP {e.code} {detail!r}")
                      refused.append(slug)
                      if e.code in (401, 402) or b'quota' in detail.lower() or b'credits' in detail.lower():
                          raise SystemExit(f"ElevenLabs will not sing anything more this run (HTTP {e.code}). Songs sung so far are kept.")
                      best = None; break
                  except (urllib.error.URLError, TimeoutError, OSError) as e:
                      print(f"    no answer from ElevenLabs for {slug} ({e}); moving on"); refused.append(slug); best = None; break
                  with tempfile.NamedTemporaryFile(suffix='.mp3', delete=False) as fh:
                      fh.write(audio); tmp = fh.name
                  bad, facts = measure(tmp, plan_ms if use_plan else length)
                  # the words: read the take back and hold it against the page
                  score = None
                  if not bad or len(bad) < 2:
                      text = heard(tmp)
                      if text is not None:
                          score, missing = fit(meta['lyrics'], text)
                          facts['words_heard'] = f'{int(score * 100)}%'
                          if score < FIT_KEEP:
                              bad.append(f'sang only {int(score * 100)}% of the lines on the page')
                              for l in missing[:6]: print(f'      not heard: {l}')
                              if len(missing) > 6: print(f'      ... and {len(missing) - 6} more')
                  os.unlink(tmp)
                  print(f'    take {attempt} ({"plan" if use_plan else "prompt"}): {len(audio)//1024} KB, {facts}')
                  if not bad:
                      best = (0, -(score or 0), audio, facts, []); break
                  print('      not kept: ' + '; '.join(bad))
                  cand = (len(bad), -(score or 0), audio, facts, bad)
                  if best is None or cand[:2] < best[:2]:
                      best = cand

              if best is None:
                  continue
              score_n, _, audio, facts, reasons = best
              out = os.path.join(os.path.dirname(p), f'{slug}-lullaby.mp3')
              if score_n == 0:
                  open(out, 'wb').write(audio)
                  open('/tmp/lst-sung.txt', 'a').write(slug + '\n')   # the next step times its words
                  print(f'    sang {slug}: {len(audio)//1024} KB, words heard {facts.get("words_heard", "unchecked")} -> {out}')
              elif (facts.get('clipped_samples') or 0) > 20000:
                  # Past saving. A night is better with no song than with a broken one.
                  print(f'    NOT KEPT after {ATTEMPTS} tries - every take was distorted '
                        f'({facts}). The night publishes without a song; ask again and it will try afresh.')
              else:
                  open(out, 'wb').write(audio)
                  open('/tmp/lst-sung.txt', 'a').write(slug + '\n')
                  print(f'    kept the best of {ATTEMPTS} for {slug}, but listen to it: '
                        + '; '.join(reasons) + f' -> {out}')
          if refused:
              print(f'{len(refused)} not sung this run (asked for again next run): ' + ', '.join(refused))
          EOF

      # THE WORDS KEEP TIME WITH THE SINGING (Levi, 1 Oct 2026). The app lights
      # each line as it is sung; a sung song keeps no clock, so every song just
      # sung is listened to once by ElevenLabs Scribe and the second each line
      # begins is written into its page (LULLABY.timing) and its lullaby.json.
      # Also times a night for today or tomorrow that was sung but never timed
      # (Scribe was busy), and any song named by hand when the run is started.
      # A song whose words Scribe cannot find is left as it was - never broken.
      # A few cents of ElevenLabs credit per song, only for songs sung this run.
      - name: Time the words of every song sung
        if: ${{ !cancelled() }}
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TIME_SLUGS: ${{ github.event.inputs.time_slugs }}
        run: |
          touch /tmp/lst-sung.txt
          python3 lantern/builder/time_words.py --from-file /tmp/lst-sung.txt --today ${TIME_SLUGS:+"$TIME_SLUGS" --force}

      # The story lullabies' catalogue (data/story-lullabies.js) says which of
      # them have a recording yet; a song just sung is marked here. No credits.
      - name: Refresh the story-lullaby catalogue
        if: ${{ !cancelled() }}
        run: python3 lantern/build_story_lullabies.py

      # 3. Put every finished night into the account - the paste Levi used to do by
      #    hand in Admin, every night. Reads lantern/<slug>/night.json and the files
      #    beside it, upserts daily_content on publish_date exactly as Admin does, then
      #    asks the narrate function to record the voices. Publishes each folder once
      #    per change (fingerprint in .published.json, committed below).
      #    Repo secret needed:  SUPABASE_SERVICE_ROLE_KEY   (Supabase > Project Settings > API)
      #    Without it the step explains and does nothing - it never fails the run.
      - name: Publish any finished night to the account (Supabase)
        # main only, again. The trigger above already keeps branch pushes out; this
        # is for the hand-pressed run, which can be aimed at any branch. Everything
        # above still runs there, so a branch can be taken all the way to the point
        # of publishing and stopped - which is a dry run, and worth having.
        #
        # The account is the live one families read tonight. There is no second copy
        # to practise on, so a night goes into it from merged work or not at all.
        #
        # Pillow re-encodes a book's photographs on the way to the account. Without
        # it the publisher says so and sends the book at full size, so a bad install
        # day costs picture weight, never the night.
        if: github.ref == 'refs/heads/main'
        env:
          DEST: lantern
          SUPABASE_URL: https://rdbvktqgrwhjucocobua.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_BASE: https://littlescripturetravelers.com
          APP_BASE: https://app.littlescripturetravelers.com
        run: |
          python3 -m pip install --quiet --disable-pip-version-check Pillow || \
            echo "Pillow would not install - books go at full size."
          python3 lantern/publish_to_supabase.py

      # THE MARKETING RULE, second half. The drafts the publisher asked for are
      # turned into finished media (image from the draft's own prompt; captioned,
      # voiced video for reels and shorts) and anything the owner has approved
      # whose time has come is handed to the poster. Both need their keys; either
      # one missing simply skips its half and says so.
      - name: Keep Playwright's Chromium between runs (the card photographer)
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.56.1

      - name: Marketing media and posting
        if: github.ref == 'refs/heads/main'
        env:
          SUPABASE_URL: https://rdbvktqgrwhjucocobua.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          DID_API_KEY: ${{ secrets.DID_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}   # the talking presenter (lip sync), pay per video
          TALKER_MODEL: ${{ vars.TALKER_MODEL }}                    # optional; default lucataco/sadtalker
        run: |
          # Catch-up: today's night gets all three slots even if it was published before this
          # step existed (each call writes the first slot still missing; drafted slots are skipped),
          # and the keyword bank is seeded once if it is empty.
          TODAY=$(TZ=America/Denver date +%F)
          for pass in 1 2 3; do
            R=$(curl -sS -X POST "$SUPABASE_URL/functions/v1/marketing-draft" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "Content-Type: application/json" \
              -d "{\"date\":\"$TODAY\"}"); echo "draft $TODAY pass $pass: $(echo "$R" | grep -o '"slot":[0-9]*\|"remaining":[0-9]*\|"skipped":"[^"]*"\|"error":"[^"]*"' | tr '\n' ' ')"
            echo "$R" | grep -q '"remaining":[1-9]' || break
          done
          BANK=$(curl -sS "$SUPABASE_URL/rest/v1/marketing_keywords?select=id&limit=1" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
          if [ "$BANK" = "[]" ]; then
            echo "keyword bank is empty - seeding it:"
            curl -sS -X POST "$SUPABASE_URL/functions/v1/marketing-draft" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "Content-Type: application/json" \
              -d '{"action":"growth","target":"seo"}' | head -c 200; echo
          fi
          if [ -z "$OPENAI_API_KEY" ]; then echo "OPENAI_API_KEY not set - no marketing media this run."; else
            python3 -m pip install --quiet --disable-pip-version-check Pillow || true
            # the video maker needs ffmpeg + ffprobe; the runner image does not always ship them
            if ! command -v ffprobe >/dev/null 2>&1; then
              sudo apt-get -qq update >/dev/null 2>&1 || true
              sudo apt-get -qq install -y ffmpeg >/dev/null 2>&1 || echo "could not install ffmpeg - videos will wait"
            fi
            # the card photographer (THE CARDS RULE) needs Playwright's Chromium
            npm install --no-save --silent playwright@1.56.1 >/dev/null 2>&1 || echo "playwright did not install - cards fall back to set words"
            npx playwright install --with-deps chromium >/dev/null 2>&1 || echo "chromium did not install - cards fall back to set words"
            python3 lantern/marketing_media.py || echo "marketing media step had trouble - the drafts are still in the desk."
          fi
          echo "Poster readiness (key set? platforms linked?):"
          curl -sS -X POST "$SUPABASE_URL/functions/v1/marketing-post" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "Content-Type: application/json" \
            -d '{"action":"status"}' | head -c 400; echo
          echo "Sweep (posts anything approved whose time has come):"
          curl -sS -X POST "$SUPABASE_URL/functions/v1/marketing-post" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "Content-Type: application/json" \
            -d '{"action":"sweep"}' | head -c 400; echo
          echo "The numbers (each posted piece's views, likes, comments, shares, saves):"
          curl -sS -X POST "$SUPABASE_URL/functions/v1/marketing-post" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "Content-Type: application/json" \
            -d '{"action":"analytics"}' | head -c 300; echo

      # Whatever happened above, a song that was sung is kept: a failure later
      # in the run must never cost the credits already spent.
      - name: Commit and push
        if: ${{ !cancelled() }}
        run: |
          git config user.name  "lantern-bot"
          git config user.email "lantern-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
          else
            git commit -m "Morning Lantern: sync $(date -u +%Y-%m-%d)"
            # the night builder, or another run of this, may have pushed meanwhile:
            # bring main in, then push. Two runs that both republished the same
            # nights clash on their .published.json bookkeeping (1 Oct 2026, run
            # 294): those markers are ours to keep - the later publish is the truer
            # one - and anything else that clashes is theirs, never overwritten here.
            if ! git pull --rebase origin main; then
              git rebase --abort 2>/dev/null || true
              if ! git pull --no-rebase --no-edit origin main; then
                for f in $(git diff --name-only --diff-filter=U); do
                  case "$f" in
                    */.published.json) git checkout --ours -- "$f" ;;
                    *)                 git checkout --theirs -- "$f" ;;
                  esac
                  git add -- "$f"
                done
                git -c core.editor=true commit --no-edit -m "Morning Lantern: sync $(date -u +%Y-%m-%d) (merged with a run that landed first)"
              fi
            fi
            git push
          fi
