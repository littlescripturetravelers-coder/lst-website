<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/images/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <title>Set a New Password &mdash; Little Scripture Travelers</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="js/lst-theme.js"></script>
  <style>
    .rp-wrap {
      min-height: 100vh;
      background: linear-gradient(160deg,var(--page),var(--page-2) 50%,var(--page-2));
      display: flex; align-items: center; justify-content: center; padding: 2rem 1.25rem;
    }
    .rp-card {
      background: var(--fill-06); border: 1px solid rgba(245,197,24,.3);
      border-radius: 1rem; padding: 2rem 1.85rem; max-width: 27rem; width: 100%;
      font-family: var(--font-body); color: var(--ink);
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }
    .rp-card h1 {
      font-family: var(--font-display); font-weight: 600; color: var(--gold-ink);
      font-size: 1.5rem; margin: 0 0 .6rem;
    }
    .rp-card p { color: var(--ink-78); line-height: 1.65; font-size: .95rem; margin: 0 0 1.2rem; }
    .rp-in {
      width: 100%; box-sizing: border-box; padding: .75rem .9rem; margin-bottom: .7rem;
      border-radius: .6rem; border: 1px solid var(--edge-22);
      background: var(--fill-08); color: var(--ink); font-size: 1rem; font-family: var(--font-body);
    }
    .rp-btn {
      width: 100%; cursor: pointer; background: #F5C518; color: #07112e; border: none;
      font-family: var(--font-body); font-weight: 900; font-size: 1rem;
      padding: .8rem; border-radius: 999px;
    }
    .rp-msg { font-size: .9rem; min-height: 1.3rem; margin: .3rem 0 .6rem; line-height: 1.5; }
    .rp-bad { color: var(--warn-ink); }
    .rp-good { color: var(--good-ink); }
    .rp-back { display: block; text-align: center; margin-top: 1rem; color: var(--ink-62); font-size: .88rem; }
  </style>
</head>
<body>
  <div class="rp-wrap">
    <div class="rp-card">
      <h1>Set a new password</h1>
      <p id="rp-intro">Checking your link&hellip;</p>

      <div id="rp-form" hidden>
        <input id="rp-pw" class="rp-in" type="password" placeholder="New password (6+ characters)" autocomplete="new-password" />
        <input id="rp-pw2" class="rp-in" type="password" placeholder="Type it again" autocomplete="new-password" />
        <div id="rp-msg" class="rp-msg"></div>
        <button id="rp-go" class="rp-btn">Save my new password</button>
      </div>

      <div id="rp-done" hidden>
        <div id="rp-done-msg" class="rp-msg rp-good">Your password is saved. You're signed in.</div>
        <a class="rp-btn" href="virtue-library.html" style="display:block;text-align:center;text-decoration:none;line-height:1.4;">Go to the Virtue Library</a>
      </div>

      <a class="rp-back" href="index.html">&larr; Back to Little Scripture Travelers</a>
    </div>
  </div>

  <script src="js/vendor/supabase.js"></script>
  <script src="js/lst-auth.js"></script>
  <script>
  (function () {
    var el = function (id) { return document.getElementById(id); };
    var intro = el("rp-intro"), form = el("rp-form"), done = el("rp-done"), msg = el("rp-msg");

    /* Supabase puts the recovery token in the URL fragment and its client
       picks it up on load, which signs the person in just long enough to
       change their password. */
    function ready() {
      var sb = LSTAuth.client();
      if (!sb) { intro.textContent = "We couldn't reach the server. Please refresh and try again."; return; }

      if (LSTAuth.signedIn()) {
        intro.textContent = "Choose a new password for " + (LSTAuth.email() || "your account") + ".";
        form.hidden = false;
        return;
      }
      intro.innerHTML = "This reset link has expired or has already been used. " +
        "Open the sign-in box again and tap <strong>Forgot your password?</strong> to get a fresh one.";
    }

    el("rp-go").addEventListener("click", function () {
      var pw = el("rp-pw").value || "", pw2 = el("rp-pw2").value || "";
      msg.className = "rp-msg rp-bad";
      if (pw.length < 6) { msg.textContent = "Please use at least 6 characters."; return; }
      if (pw !== pw2) { msg.textContent = "Those two don't match yet."; return; }

      msg.className = "rp-msg";
      msg.textContent = "Saving…";
      el("rp-go").disabled = true;

      LSTAuth.client().auth.updateUser({ password: pw }).then(function (res) {
        el("rp-go").disabled = false;
        if (res.error) {
          msg.className = "rp-msg rp-bad";
          msg.textContent = res.error.message;
          return;
        }
        form.hidden = true;
        intro.hidden = true;
        done.hidden = false;
      }).catch(function () {
        el("rp-go").disabled = false;
        msg.className = "rp-msg rp-bad";
        msg.textContent = "Something went wrong. Please try again.";
      });
    });

    /* Give the client a moment to consume the token from the URL. */
    LSTAuth.ready(function () {
      if (LSTAuth.signedIn()) { ready(); return; }
      setTimeout(function () { LSTAuth.refresh().then(ready); }, 700);
    });
  })();
  </script>
  <script src="js/lst-signed-in.js"></script>
</body>
</html>
