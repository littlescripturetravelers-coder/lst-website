<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#152449">
<title>The Happiest Reading Day &middot; Little Scripture Travelers</title>
<link rel="stylesheet" href="../fonts-embed.css">
<style>
  /* ═══════════════════════════════════════════════
     THEMES — Traditional (the night sky), Light, Dark.
     Gold, teal and amber never change; they are the brand.
     What changes is the surface they sit on.

     FULL-BLEED EDITION
     The artwork now owns the whole screen, edge to edge.
     The words sit on top of it, on a soft scrim that fades
     up out of the bottom of the picture. Nothing is boxed,
     nothing is letterboxed, and no cream margin is wasted.
  ═══════════════════════════════════════════════ */
  :root{
    --navy:#1B2D5F;
    --gold:#F5C518;
    --teal:#5BD3DC;
    --amber:#D9A227;
    --cream:#FBF7EA;
    --beau:#8A4B2A;
    --scout:#4F9E5F;
    --willow:#8E63B5;
    --wren:#E0603C;
    --display:'Fredoka',system-ui,sans-serif;
    --body:'Nunito',system-ui,sans-serif;

    /* surfaces */
    --app-bg:#152449;
    --page:#FBF7EA;
    --art-bg:#101B39;
    --ink:#1B2D5F;
    --ink-soft:#4A5878;
    --title:#1B2D5F;
    --chrome:#FBF7EA;
    --chrome-soft:rgba(251,247,234,.75);
    --dot:rgba(251,247,234,.30);
    --pill-bg:rgba(10,16,34,.42);

    /* the scrim the words rest on, and the ink that sits on it */
    --scrim-a:rgba(13,22,48,.55);
    --scrim-b:rgba(9,15,34,.93);
    --top-scrim:linear-gradient(to bottom,rgba(6,11,26,.62),rgba(6,11,26,0));
    --ov-ink:#FBF7EA;
    --ov-soft:rgba(251,247,234,.78);
    --ov-title:#F5C518;
    --ov-eyebrow:#7BC98A;
    --ov-parent:#F0C24E;
    --ov-shadow:0 1px 14px rgba(0,0,0,.55);
    --spot:#6EC3E6; --name:#F4C61F; --find:#7BC98A; --fork:#F08A5F; --calm:#BE95DE;
  }
  [data-theme="light"]{
    --app-bg:#E8EBF2;
    --page:#FFFFFF;
    --art-bg:#DDE3EE;
    --ink:#1B2D5F;
    --ink-soft:#5A6683;
    --title:#1B2D5F;
    --chrome:#1B2D5F;
    --chrome-soft:rgba(27,45,95,.7);
    --dot:rgba(27,45,95,.25);
    --pill-bg:rgba(255,255,255,.72);

    --scrim-a:rgba(252,250,243,.62);
    --scrim-b:rgba(252,250,243,.97);
    --top-scrim:linear-gradient(to bottom,rgba(252,250,243,.82),rgba(252,250,243,0));
    --ov-ink:#1B2D5F;
    --ov-soft:#5A6683;
    --ov-title:#1B2D5F;
    --ov-eyebrow:#3F8A50;
    --ov-parent:#9A730F;
    --ov-shadow:none;
    --spot:#3E90BA; --name:#B98A05; --find:#3F7A2E; --fork:#C4522C; --calm:#7E4FA8;
  }
  [data-theme="dark"]{
    --app-bg:#05060A;
    --page:#12151B;
    --art-bg:#05060A;
    --ink:#E7E2D5;
    --ink-soft:#9AA3B4;
    --title:#F5C518;
    --chrome:#E7E2D5;
    --chrome-soft:rgba(231,226,213,.68);
    --dot:rgba(231,226,213,.26);
    --pill-bg:rgba(0,0,0,.5);

    --scrim-a:rgba(3,4,7,.62);
    --scrim-b:rgba(3,4,7,.96);
    --top-scrim:linear-gradient(to bottom,rgba(0,0,0,.7),rgba(0,0,0,0));
    --ov-ink:#E7E2D5;
    --ov-soft:rgba(231,226,213,.7);
    --ov-title:#F5C518;
    --ov-eyebrow:#79BE88;
    --ov-parent:#D9A227;
    --ov-shadow:0 1px 14px rgba(0,0,0,.7);
    --spot:#6EC3E6; --name:#F4C61F; --find:#79BE88; --fork:#E8794F; --calm:#B98FD6;
  }
  [data-theme="light"] .back{color:#0E7C85}
  [data-theme="light"] .hint .chev{border-color:#0E7C85}
  [data-theme="light"] .pill{border-color:rgba(27,45,95,.25)}
  [data-theme="light"] .themebtn{border-color:rgba(27,45,95,.25)}
  [data-theme="light"] .pill.play{color:#9A730F;border-color:rgba(217,162,39,.75)}
  [data-theme="light"] .dot.on{background:var(--amber)}

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;overscroll-behavior:none}
  html{height:100%}
  body{
    background:var(--app-bg);
    font-family:var(--body);
    color:var(--chrome);
    height:100dvh;
    overflow:hidden;
    position:relative;
    transition:background-color .25s ease,color .25s ease;
  }

  /* ---------- the book is the whole screen ---------- */
  .stage{position:absolute;inset:0}
  .book{
    position:absolute;inset:0;
    overflow:hidden;background:var(--art-bg);
    touch-action:pan-y;cursor:pointer;border:0;padding:0;display:block;
  }
  .page{position:absolute;inset:0;will-change:transform;text-align:left;background:var(--art-bg);
       /* --peek is how much of the screen stays clear picture before the
          words begin. The engine measures the artwork and sets it per page,
          inside the min/max below, so the words start just under the picture
          instead of at a fixed line. --blend is how far they tuck up under
          its feathered foot. */
       --peek:62vh;--peek-min:42%;--peek-max:82%;--blend:40px}
  .page.sliding{transition:transform 340ms cubic-bezier(.25,.85,.35,1)}
  .page.lifted{box-shadow:14px 0 34px rgba(0,0,0,.45)}

  /* ---------- the picture: every pixel of the screen ---------- */
  .art{position:absolute;inset:0;overflow:hidden;background:var(--art-bg);z-index:1}
  /* a blurred copy of the same picture bleeds the artwork out to every
     edge, so the screen is full of the picture — never a black bar —
     while the artwork itself is still shown whole and uncropped */
  .artbg{position:absolute;inset:-12%;background-size:cover;background-position:center;
         filter:blur(58px) saturate(1.3) brightness(1.02);transform:scale(1.24);opacity:1}
  [data-theme="light"] .artbg{filter:blur(42px) saturate(1.15) brightness(1.14);opacity:.82}
  [data-theme="dark"]  .artbg{filter:blur(42px) saturate(1) brightness(.62);opacity:.95}
  /* a gentle vignette so the bled edges feel lit, not washed out */
  .art::after{content:"";position:absolute;inset:0;pointer-events:none;
              background:radial-gradient(ellipse at 50% 38%,rgba(0,0,0,0) 42%,rgba(0,0,0,.34) 100%)}
  [data-theme="light"] .art::after{background:radial-gradient(ellipse at 50% 38%,rgba(0,0,0,0) 48%,rgba(0,0,0,.12) 100%)}
  /* The picture now takes the whole screen: it is scaled to the largest
     size that fits without a single edge being cut, and the words are told
     to begin just under it. --art-y is how high it rides in whatever room
     is left over: a small number sits it high, 50% centres it. */
  .art img{
    position:absolute;top:0;left:0;right:auto;width:100%;
    height:100%;
    display:block;
    object-fit:contain;object-position:center center;
    /* The picture has no edge of its own: each side dissolves into the
       blurred copy of itself behind it, so the art simply runs out to the
       edges of the screen. Bottom fades furthest, into the words. */
    --feather:30px; --feather-b:38px;
    -webkit-mask-image:
      linear-gradient(to right,  transparent 0, #000 var(--feather), #000 calc(100% - var(--feather)), transparent 100%),
      linear-gradient(to bottom, transparent 0, #000 var(--feather), #000 calc(100% - var(--feather-b)), transparent 100%);
    -webkit-mask-composite:source-in;
            mask-image:
      linear-gradient(to right,  transparent 0, #000 var(--feather), #000 calc(100% - var(--feather)), transparent 100%),
      linear-gradient(to bottom, transparent 0, #000 var(--feather), #000 calc(100% - var(--feather-b)), transparent 100%);
            mask-composite:intersect;
    -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
  }
  /* nothing is ever cropped now, so this is kept only for older data */
  .page.crop .art img{object-fit:contain;height:100%}
  .page.noart .art{display:none}

  /* ---------- the words: on the picture, not beside it ---------- */
  /* The words are a scroll layer over the whole picture. At rest they wait
     below the fold; as you scroll they rise, and because the scrim travels
     with them the picture quietly slips away behind the reading. */
  .panel{
    position:absolute;inset:0;z-index:2;
    overflow-y:auto;-webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    display:block;padding:0;background:none;
    color:var(--ov-ink);
    text-shadow:var(--ov-shadow);
    scrollbar-width:none;
  }
  .panel::-webkit-scrollbar{display:none}
  .sheet{
    margin-top:var(--peek);
    min-height:calc(100% - var(--peek));
    padding:3rem 1.35rem calc(env(safe-area-inset-bottom,0px) + 6.4rem);
    background:linear-gradient(to bottom,
                rgba(0,0,0,0) 0,
                var(--scrim-a) 36px,
                var(--scrim-b) 130px,
                var(--scrim-b) 100%);
  }
  /* stones and numbered prompts start their words higher up the screen */
  .page.dense{--peek-max:66%}
  .panel-inner{width:100%;max-width:34rem;margin:0 auto}

  .eyebrow{font:800 .68rem/1.35 var(--body);letter-spacing:.18em;text-transform:uppercase;
           color:var(--ov-eyebrow);margin:0 0 .5rem}
  .eyebrow.forparent{color:var(--ov-parent)}
  .panel h1{font:700 clamp(1.9rem,8vw,2.6rem)/1.06 var(--display);letter-spacing:-.5px;
            color:var(--ov-title);margin:.1rem 0 .5rem}
  .ref{font:400 1.02rem/1.4 var(--body);font-style:italic;color:var(--ov-soft);margin:0}
  .storytext{font:400 clamp(1.06rem,4.5vw,1.24rem)/1.62 var(--body);margin:0}
  .storytext + .storytext{margin-top:.85rem}
  .rule{height:2px;width:56px;background:var(--amber);border-radius:2px;margin:.85rem 0 1rem;box-shadow:none}
  .stones{margin:1rem 0 0;padding:0;list-style:none}
  .stones li{display:grid;grid-template-columns:4.2rem minmax(0,1fr);gap:.6rem;margin-bottom:.65rem;align-items:start}
  .stones li:last-child{margin-bottom:0}
  .stones .k{font:800 .72rem/1.55 var(--body);letter-spacing:.1em;text-transform:uppercase}
  .stones .v{font:400 clamp(.98rem,3.9vw,1.08rem)/1.5 var(--body)}
  .stones .spot{color:var(--spot)} .stones .name{color:var(--name)}
  .stones .find{color:var(--find)} .stones .fork{color:var(--fork)}
  .stones .calm{color:var(--calm)}
  .substep{font:800 .64rem/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--ov-parent);margin:1.15rem 0 .2rem}
  ol.prompts{margin:.25rem 0 0;padding-left:1.15rem}
  ol.prompts li{font:400 clamp(1rem,4.1vw,1.1rem)/1.55 var(--body);margin-bottom:.75rem}
  ol.prompts li::marker{color:var(--ov-parent);font-weight:800}

  /* the goodnight plate has no picture, so it becomes the paper itself */
  .page.noart .panel{
    background:var(--page);
    --ov-ink:var(--ink);--ov-title:var(--title);--ov-soft:var(--ink-soft);--ov-shadow:none;
  }
  .page.noart .sheet{
    margin-top:0;min-height:100%;background:none;
    display:flex;align-items:center;justify-content:center;
    padding:4.5rem 1.5rem calc(env(safe-area-inset-bottom,0px) + 4.2rem);
  }
  .page.noart .panel-inner{margin:auto}
  .endplate{text-align:center}
  .endplate .moon{font-size:2rem;line-height:1}
  .endplate h1{font:700 2.1rem/1.1 var(--display);color:var(--title);margin:.7rem 0 .1rem}
  .endplate h2{font:600 1.4rem/1.1 var(--display);color:var(--scout);margin:0 0 .9rem}
  .endplate p{font:400 1.02rem/1.6 var(--body);color:var(--ink-soft);margin:0 auto;max-width:34ch}
  .endplate .sig{font:400 .76rem/1.5 var(--body);color:var(--ink-soft);opacity:.75;margin-top:1.2rem}
  .travelers{display:flex;gap:8px;justify-content:center;margin-top:1.1rem}
  .travelers span{width:11px;height:11px;border-radius:50%}

  /* a quiet nudge when there are more words below the fold */
  .morecue{
    position:absolute;right:.9rem;z-index:5;pointer-events:none;
    bottom:calc(env(safe-area-inset-bottom,0px) + 3.5rem);
    transform:translate(0,0);opacity:0;transition:opacity .28s ease;
    display:flex;align-items:center;gap:.4rem;
    padding:.34rem .7rem;border-radius:999px;
    background:var(--pill-bg);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:1px solid rgba(91,211,220,.35);
    font:800 .58rem/1 var(--body);letter-spacing:.14em;text-transform:uppercase;
    color:var(--chrome-soft);text-shadow:none;
  }
  .page.more .morecue{opacity:1;animation:bob 1.9s ease-in-out infinite}
  .morecue .arw{width:8px;height:8px;border-right:2.5px solid var(--teal);
                border-bottom:2.5px solid var(--teal);transform:rotate(45deg)}
  @keyframes bob{0%,100%{transform:translate(0,0)}50%{transform:translate(0,4px)}}

  /* ---------- chrome floats over the picture ---------- */
  .bar{
    position:absolute;top:0;left:0;right:0;z-index:6;
    display:flex;align-items:center;gap:.5rem;
    padding:calc(env(safe-area-inset-top,0px) + .5rem) .9rem 1.5rem;
    background:var(--top-scrim);pointer-events:none;
  }
  .bar > *{pointer-events:auto}
  .back{font:700 .82rem/1 var(--body);color:var(--teal);background:none;border:0;padding:.3rem .1rem;
        cursor:pointer;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
        text-shadow:0 1px 10px rgba(0,0,0,.5)}
  .bar .night{margin-left:auto;font:800 .68rem/1 var(--body);letter-spacing:.15em;text-transform:uppercase;
              color:var(--gold);text-shadow:0 1px 10px rgba(0,0,0,.5);
              white-space:nowrap;flex:0 0 auto}
  .themebtn{
    flex:0 0 auto;font:800 .62rem/1 var(--body);letter-spacing:.12em;text-transform:uppercase;
    color:var(--chrome);background:var(--pill-bg);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:1px solid rgba(91,211,220,.35);border-radius:999px;
    padding:.42rem .62rem;cursor:pointer;display:flex;align-items:center;gap:.35rem;
  }
  .themebtn .swatch{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 1.5px rgba(0,0,0,.25)}
  .back:focus-visible,.book:focus-visible,.pill:focus-visible,.themebtn:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:10px}

  .controls{
    position:absolute;left:0;right:0;bottom:0;z-index:6;
    display:flex;gap:.45rem;align-items:center;
    padding:.5rem .9rem calc(env(safe-area-inset-bottom,0px) + .55rem);
    pointer-events:none;
  }
  /* words that scroll past the bottom fade out under the controls
     instead of colliding with them */
  .controls::before{
    content:"";position:absolute;left:0;right:0;bottom:0;top:-1.6rem;z-index:-1;
    background:linear-gradient(to bottom,rgba(0,0,0,0),var(--scrim-b) 55%);
  }
  body.plain .controls::before{background:linear-gradient(to bottom,rgba(0,0,0,0),var(--page) 55%)}
  .controls > *{pointer-events:auto}
  .dots{display:flex;gap:5px;flex:0 0 auto}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--dot);transition:background .3s,transform .3s}
  .dot.on{background:var(--gold);transform:scale(1.3)}
  .hint{font:700 .76rem/1 var(--body);color:var(--chrome-soft);display:flex;align-items:center;gap:.35rem;margin-left:.5rem}
  .hint .chev{display:inline-block;width:9px;height:9px;border-right:2.5px solid var(--teal);border-bottom:2.5px solid var(--teal);transform:rotate(-45deg)}
  .nudge .chev{animation:nudge 1.6s ease-in-out infinite}
  @keyframes nudge{0%,100%{transform:rotate(-45deg) translate(0,0)}50%{transform:rotate(-45deg) translate(3px,3px)}}
  .pill{font:700 .76rem/1 var(--body);color:var(--chrome);background:var(--pill-bg);
        backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
        border:1px solid rgba(91,211,220,.35);border-radius:999px;padding:.52rem .8rem;cursor:pointer;white-space:nowrap}
  .pill[disabled]{opacity:.35;cursor:default}
  .pill.icon{padding:.52rem .7rem}
  .pill.play{margin-left:auto;border-color:rgba(245,197,24,.55);color:var(--gold)}
  @media (max-width:420px){ .hint{display:none} }

  /* ---------- landscape: words down one side of the picture ---------- */
  @media (orientation:landscape) and (min-width:700px){
    /* the picture keeps its own column beside the words, still uncropped */
    .art img{height:100%;object-position:center center}
    .page.crop .art img{object-fit:contain;height:100%}
    .panel{left:auto;right:0;top:0;width:min(46%,34rem);height:100%}
    .sheet{
      margin-top:0;min-height:100%;
      display:flex;align-items:center;justify-content:center;
      padding:4.2rem 2rem calc(env(safe-area-inset-bottom,0px) + 4rem);
      background:linear-gradient(to right,
                  rgba(0,0,0,0) 0,
                  var(--scrim-a) 54px,
                  var(--scrim-b) 150px,
                  var(--scrim-b) 100%);
    }
    /* with no picture there is nothing to sit beside, so the words
       take the whole width instead of a narrow column */
    .page.noart .panel,
    .page.noart.dense .panel{left:0;right:0;width:100%}
    .page.noart .sheet{padding:3.4rem 2.6rem calc(env(safe-area-inset-bottom,0px) + 3.8rem)}
    .panel h1{font-size:clamp(1.7rem,3.6vw,2.3rem)}
    .storytext{font-size:clamp(1rem,2.1vw,1.16rem)}
  }

  /* the lullaby, one tap from the last page */
  .endplate .songlink{display:inline-flex;flex-direction:column;align-items:center;gap:.15rem;margin:1.1rem auto .4rem;
    padding:.75rem 1.4rem;border-radius:999px;background:var(--gold);color:var(--navy);text-decoration:none;
    font:600 1.05rem/1.2 var(--display);box-shadow:0 6px 18px rgba(0,0,0,.25)}
  .endplate .songlink small{font:700 .72rem/1.3 var(--body);opacity:.8}
  .endplate .songlink:active{transform:scale(.98)}
  @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>

<div class="bar">
  <a class="back" id="backLink" aria-label="Back to tonight's devotional">&larr; Devotional</a>
  <button class="themebtn" id="themeBtn" type="button" aria-label="Colour theme">
    <span class="swatch" aria-hidden="true"></span><span class="tlabel">Traditional</span>
  </button>
  <span class="night" id="nightLabel">Week 2 &middot; Night 1</span>
</div>

<main class="stage">
  <div class="book" id="book" role="button" tabindex="0" aria-live="polite" aria-label="Story pages. Tap or swipe to turn.">
    <div class="page" id="pageA"></div>
    <div class="page" id="pageB"></div>
  </div>
</main>

<div class="controls">
  <div class="dots" id="dots"></div>
  <span class="hint" id="hint"><span id="hintText">Tap to begin</span><span class="chev"></span></span>
  <button class="pill" id="backBtn" disabled>Back</button>
  <button class="pill icon" id="restartBtn" aria-label="Start over" title="Start over">&#8634;</button>
</div>

<script>
/* ============================================================

/* ============================================================
   THEME — Traditional / Light / Dark
     1. ?theme=blue|light|dark on the URL
     2. window.LST_APP_THEME set before this script runs
     3. data-theme already on <html>
     4. lst_theme in storage (what the app saves)
     5. the device's own colour scheme
   ============================================================ */
(function(){
  var THEMES = ['blue','light','dark'];
  var LABEL  = { blue:'Traditional', light:'Light', dark:'Dark' };
  var BAR    = { blue:'#152449',     light:'#E8EBF2', dark:'#05060A' };
  var chosen = false;
  var current = 'blue';

  function norm(n){
    n = String(n || '').toLowerCase();
    if (n === 'traditional' || n === 'navy') n = 'blue';
    return THEMES.indexOf(n) > -1 ? n : null;
  }

  function apply(name){
    current = norm(name) || 'blue';
    if (current === 'blue') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', current);

    var meta = document.querySelector('meta[name="theme-color"]');
    if (!meta){ meta = document.createElement('meta'); meta.name = 'theme-color'; document.head.appendChild(meta); }
    meta.content = BAR[current];

    var btn = document.getElementById('themeBtn');
    if (btn){
      btn.querySelector('.tlabel').textContent = LABEL[current];
      btn.setAttribute('aria-label', 'Colour theme: ' + LABEL[current] + '. Tap to change.');
    }
  }

  function save(name){ try { localStorage.setItem('lst_theme', name); } catch(e){} }

  var fromUrl = null;
  try { var m = location.search.match(/[?&]theme=([a-z]+)/i); if (m) fromUrl = norm(m[1]); } catch(e){}
  var preset = norm(document.documentElement.getAttribute('data-theme'));
  var saved  = null;
  try { saved = norm(localStorage.getItem('lst_theme')); } catch(e){}
  var system = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : null;

  var start = fromUrl || norm(window.LST_APP_THEME) || preset || saved || system || 'blue';
  chosen = !!(fromUrl || window.LST_APP_THEME || preset || saved);
  apply(start);

  try {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var onScheme = function(e){ if (!chosen) apply(e.matches ? 'dark' : 'blue'); };
    if (mq.addEventListener) mq.addEventListener('change', onScheme);
    else if (mq.addListener) mq.addListener(onScheme);
  } catch(e){}

  var btn = document.getElementById('themeBtn');
  if (btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var next = THEMES[(THEMES.indexOf(current) + 1) % THEMES.length];
      chosen = true; apply(next); save(next);
    });
  }

  window.setStoryTheme = function(name){ var n = norm(name); if (n){ chosen = true; apply(n); save(n); } };
  window.addEventListener('message', function(e){
    var d = e && e.data;
    if (d && d.type === 'lst-theme' && d.theme) window.setStoryTheme(d.theme);
  });
})();

   ENGINE — generic below this line.
   Two sheets sit stacked inside the book. Turning forward slides
   the top sheet off to the left; the next page is already sitting
   underneath it. Turning back slides the previous sheet in over
   the top. That is the Kindle behaviour — no flip, no fade.
   ============================================================ */

  night: document.getElementById('nightLabel')
};

let i = 0;
let front = 0;

(function(){
  const back = document.getElementById('backLink');
  if (!back) return;
  const dest = (STORY.devotionalUrl || '').trim();

  if (dest && dest !== '#'){ back.href = dest; return; }

  back.removeAttribute('href');
  back.setAttribute('role', 'button');
  back.setAttribute('tabindex', '0');

  function goBack(e){
    if (e) e.preventDefault();
    if (typeof window.LSTApp !== 'undefined' && window.LSTApp.back){
      window.LSTApp.back(); return;
    }
    if (window.parent !== window){
      window.parent.postMessage({type:'lst:back'}, '*'); return;
    }
    if (window.history.length > 1){ window.history.back(); return; }
  }

  back.addEventListener('click', goBack);
  back.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' ') goBack(e);
  });
})();


STORY.beats.forEach(function(){
  const d = document.createElement('span');
  d.className = 'dot';
  els.dots.appendChild(d);
});

/* ---------- rendering ---------- */
function renderBody(b){
  if (b.type === 'cover'){
    return (STORY.storyNumber ? '<p class="eyebrow">~ Story ' + STORY.storyNumber + ' ~</p>' : '') +
           '<h1>' + STORY.title + '</h1><div class="rule"></div>' +
           '<p class="ref">' + STORY.reference + '</p>';
  }
  if (b.type === 'end'){
    return '<div class="endplate"><div class="moon">&#127769;</div>' +
           '<h1>Sweet Dreams,</h1><h2>Little Traveler</h2>' +
           '<p>Until our next adventure, may these stories tuck themselves gently into your heart &mdash; like the warmth of a hug at the end of the day.</p>' +
           '<p class="sig">Little Scripture Travelers &middot; Old Testament &middot; Wonderful Is His Way<br>~ Beau, Scout, Willow, &amp; Wren ~</p>' +
           (STORY.lullabyUrl ? '<a class="songlink" href="' + STORY.lullabyUrl + '">&#9835; Sing tonight&rsquo;s lullaby<small>' + (STORY.lullabyTitle ? STORY.lullabyTitle + ' &middot; ' : '') + 'lyrics &amp; music</small></a>' : '') +
             '<div class="travelers">' +
             '<span style="background:var(--beau)"></span>' +
             '<span style="background:var(--scout)"></span>' +
             '<span style="background:var(--willow)"></span>' +
             '<span style="background:var(--wren)"></span>' +
           '</div></div>';
  }
  let h = '';
  if (b.eyebrow) h += '<p class="eyebrow' + (b.forParent ? ' forparent' : '') + '">' + b.eyebrow + '</p>';
  if (b.heading) h += '<h1>' + b.heading + '</h1><div class="rule"></div>';
  if (b.text) h += b.text.map(function(t){ return '<p class="storytext">' + t + '</p>'; }).join('');
  if (b.stones){
    h += '<p class="substep">The Five Stones</p><ul class="stones">' +
         b.stones.map(function(s){
           return '<li><span class="k ' + s[0].toLowerCase() + '">' + s[0] + '</span>' +
                  '<span class="v">' + s[1] + '</span></li>';
         }).join('') + '</ul>';
  }
  if (b.list) h += '<ol class="prompts">' + b.list.map(function(t){ return '<li>' + t + '</li>'; }).join('') + '</ol>';
  return h;
}

/* ── Show the picture as large as the screen will hold it without cutting
      an edge, then tell the words to begin just underneath it. ─────────
   Everything below the fold is reached by scrolling, and the words carry
   their own scrim upward as they come, so the picture is never competing
   with the reading. --peek-min and --peek-max keep both honest: the words
   are always discoverable, and the picture is never reduced to a strip. */

function cssPx(value){
  value = String(value || '').trim();
  if (value.endsWith('rem')){
    const root = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
    return parseFloat(value) * root;
  }
  return parseFloat(value) || 0;
}

function peekRange(el, H){
  const cs = getComputedStyle(el);
  const read = function(name, dflt){
    const v = parseFloat(cs.getPropertyValue(name));
    return isFinite(v) ? v : dflt;
  };
  const lo = read('--peek-min', 42);
  let   hi = read('--peek-max', 82);
  if (H < 700) hi -= 8;          /* a short screen keeps the words within reach */
  hi = Math.max(lo, hi);
  return [H * lo / 100, H * hi / 100];
}

function fitArt(el){
  const im = el.querySelector('.art img');
  if (!im){ el.style.removeProperty('--peek'); return; }

  const H = el.clientHeight, W = el.clientWidth;
  if (!H || !W || !im.naturalWidth || !im.naturalHeight) return;

  /* Lay the <img> over exactly the pixels the picture occupies. object-fit
     would centre it inside a roomier box, and the edge mask would then fade
     empty space instead of the artwork. */
  if (window.matchMedia('(orientation:landscape) and (min-width:700px)').matches){
    const panel = el.querySelector('.panel');
    const boxW  = Math.max(160, W - (panel ? panel.clientWidth : 0));
    const s  = Math.min(boxW / im.naturalWidth, H / im.naturalHeight);
    const dw = im.naturalWidth * s, dh = im.naturalHeight * s;
    el.style.removeProperty('--peek');
    im.style.width = dw + 'px'; im.style.height = dh + 'px';
    im.style.left  = ((boxW - dw) / 2) + 'px';
    im.style.top   = ((H - dh) / 2) + 'px';
    im.style.right = 'auto';
    return;
  }

  /* the largest whole picture this screen will hold */
  const scale = Math.min(W / im.naturalWidth, H / im.naturalHeight);
  const dw = im.naturalWidth  * scale;
  const dh = im.naturalHeight * scale;

  /* where it rides in whatever room is left over */
  const f = Math.max(0, Math.min(1,
        (parseFloat(im.style.getPropertyValue('--art-y')) || 30) / 100));
  const top = Math.max(0, Math.min(H - dh, (H - dh) * f));

  im.style.width  = dw + 'px';
  im.style.height = dh + 'px';
  im.style.left   = ((W - dw) / 2) + 'px';
  im.style.top    = top + 'px';
  im.style.right  = 'auto';

  /* the words begin where the picture ends, tucked up by --blend so its
     feathered foot melts into the clear top of their scrim */
  const blend = cssPx(getComputedStyle(el).getPropertyValue('--blend')) || 40;
  const r = peekRange(el, H);
  const peek = Math.max(r[0], Math.min(r[1], top + dh - blend));
  el.style.setProperty('--peek', Math.round(peek) + 'px');
}

/* is there more text below the fold on this sheet? */
function syncMore(el){
  const p = el.querySelector('.panel');
  const inner = el.querySelector('.panel-inner');
  if (!p || !inner){ el.classList.remove('more'); return; }
  /* Ask the only question that matters: does any WORD fall behind the
     controls? Counting raw scrollHeight cries "more" over the panel's own
     bottom padding, when the last line is already in plain view. */
  const bar = document.querySelector('.controls');
  const floorY = bar ? bar.getBoundingClientRect().top - 6
                     : p.getBoundingClientRect().bottom;
  el.classList.toggle('more', inner.getBoundingClientRect().bottom > floorY);
}

function drawSheet(el, n){
  const b = STORY.beats[n];
  el.classList.toggle('noart', !b.img);
  el.classList.toggle('dense', !!(b.stones || b.list));
  el.classList.toggle('crop', !!b.crop);
  el.innerHTML =
    '<div class="art">' + (b.img ? '<div class="artbg" aria-hidden="true"></div><img src="' + b.img + '" alt="' + (b.alt || '') + '">' : '') + '</div>' +
    '<div class="panel"><div class="sheet"><div class="panel-inner">' + renderBody(b) + '</div></div></div>' +
    '<div class="morecue" aria-hidden="true"><span>Scroll</span><span class="arw"></span></div>';
  if (b.img){
    const bg = el.querySelector('.artbg');
    if (bg) bg.style.backgroundImage = 'url("' + b.img + '")';
    /* how high the artwork rides inside the screen, so faces stay
       clear of the words below them */
    const im = el.querySelector('.art img');
    if (im && b.focus) im.style.setProperty('--art-y', b.focus);
  }
  const p = el.querySelector('.panel');
  if (p){
    p.scrollTop = 0;
    p.addEventListener('scroll', function(){ syncMore(el); }, {passive:true});
  }

  const im = el.querySelector('.art img');
  if (im && !(im.complete && im.naturalWidth)){
    im.addEventListener('load', function(){ fitArt(el); syncMore(el); }, {once:true});
  }
  fitArt(el);
  requestAnimationFrame(function(){ syncMore(el); });
}

function chrome(){
  document.body.classList.toggle('plain', !STORY.beats[i].img);
  const kids = els.dots.children;
  for (let n = 0; n < kids.length; n++) kids[n].classList.toggle('on', n <= i);
  els.back.disabled = (i === 0);
  els.hintText.textContent = (i === LAST) ? 'Goodnight' : (i === 0 ? 'Tap to begin' : 'Tap to keep going');
  els.hint.style.opacity = (i === LAST) ? .45 : 1;
  try { localStorage.setItem(KEY, String(i)); } catch(e){}
  els.hint.classList.remove('nudge');
  clearTimeout(idleTimer);
  if (i < LAST) idleTimer = setTimeout(function(){ els.hint.classList.add('nudge'); }, 4000);
}

function place(el, x, z){
  el.classList.remove('sliding');
  el.style.transform = 'translateX(' + x + ')';
  el.style.zIndex = z;
}

function settle(){
  front = 1 - front;
  for (let n = 0; n < sheets.length; n++){
    sheets[n].classList.remove('sliding','lifted');
    sheets[n].style.transform = 'translateX(0%)';
    sheets[n].style.zIndex = (n === front) ? 2 : 1;
  }
  busy = false;
}

/* ---------- the turn ---------- */
function turn(dir, target){
  const top = sheets[front];
  const under = sheets[1 - front];
  drawSheet(under, target);

  if (dir > 0){
    place(under, '0%', 1);
    place(top, '0%', 2);
    top.classList.add('lifted');
    void top.offsetWidth;
    top.classList.add('sliding');
    top.style.transform = 'translateX(-100%)';
  } else {
    place(top, '0%', 1);
    place(under, '-100%', 2);
    under.classList.add('lifted');
    void under.offsetWidth;
    under.classList.add('sliding');
    under.style.transform = 'translateX(0%)';
  }

  if (reduceMotion) settle();
  else setTimeout(settle, TURN_MS);
}

function go(n, animate){
  if (busy) return;
  const next = Math.max(0, Math.min(LAST, n));
  if (next === i){ if (animate) bump(n > i ? 1 : -1); return; }
  const dir = next > i ? 1 : -1;
  i = next;
  chrome();
  if (!animate || reduceMotion){ drawSheet(sheets[front], i); return; }
  busy = true;
  turn(dir, i);
}

function bump(dir){
  if (reduceMotion) return;
  const top = sheets[front];
  top.classList.add('sliding');
  top.style.transform = 'translateX(' + (dir * -12) + 'px)';
  setTimeout(function(){ top.style.transform = 'translateX(0%)'; }, 130);
  setTimeout(function(){ top.classList.remove('sliding'); }, 500);
}

/* ---------- drag: the sheet follows your finger ---------- */
let sx = 0, sy = 0, st = 0, mode = null, prepped = null, swiped = false, width = 1;

function startDrag(x, y){
  if (busy) return;
  sx = x; sy = y; st = Date.now(); mode = 'undecided'; prepped = null;
  width = book.clientWidth || 1;
}

function moveDrag(x, y){
  if (busy || mode === null || mode === 'scroll') return;
  const dx = x - sx, dy = y - sy;

  if (mode === 'undecided'){
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
    if (Math.abs(dy) > Math.abs(dx)){ mode = 'scroll'; return; }
    const dir = dx < 0 ? 1 : -1;
    if ((dir > 0 && i === LAST) || (dir < 0 && i === 0)){ mode = 'edge'; return; }
    mode = 'drag';
    const target = i + dir;
    const top = sheets[front], under = sheets[1 - front];
    drawSheet(under, target);
    if (dir > 0){ place(under, '0%', 1); place(top, '0%', 2); top.classList.add('lifted'); }
    else        { place(top, '0%', 1); place(under, '-100%', 2); under.classList.add('lifted'); }
    prepped = { dir: dir, target: target, mover: (dir > 0 ? top : under) };
  }

  if (mode === 'edge'){
    const pull = Math.max(-26, Math.min(26, dx * 0.25));
    sheets[front].style.transform = 'translateX(' + pull + 'px)';
    return;
  }

  if (mode === 'drag' && prepped){
    const base = prepped.dir > 0 ? 0 : -width;
    let pos = base + dx;
    if (pos < -width) pos = -width;
    if (pos > 0) pos = 0;
    prepped.mover.style.transform = 'translateX(' + pos + 'px)';
  }
}

function endDrag(x, y){
  if (mode === null) return;
  const dx = x - sx, dy = y - sy;
  const quick = (Date.now() - st) < 420;
  const far = Math.abs(dx) > width * 0.28;
  const m = mode, p = prepped;
  mode = null; prepped = null;

  if (m === 'edge'){
    const top = sheets[front];
    top.classList.add('sliding');
    top.style.transform = 'translateX(0%)';
    setTimeout(function(){ top.classList.remove('sliding'); }, 400);
    return;
  }
  /* a vertical flick was reading, not a page turn */
  if (m === 'scroll'){
    swiped = true;
    setTimeout(function(){ swiped = false; }, 380);
    return;
  }
  if (m !== 'drag' || !p) return;

  swiped = true;
  setTimeout(function(){ swiped = false; }, 380);

  const commit = far || (quick && Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy));
  const mover = p.mover;
  busy = true;
  mover.classList.add('sliding');

  if (commit){
    i = p.target;
    chrome();
    mover.style.transform = (p.dir > 0) ? 'translateX(-100%)' : 'translateX(0%)';
    setTimeout(settle, 300);
  } else {
    mover.style.transform = (p.dir > 0) ? 'translateX(0%)' : 'translateX(-100%)';
    setTimeout(function(){
      for (let n = 0; n < sheets.length; n++){
        sheets[n].classList.remove('sliding','lifted');
        sheets[n].style.transform = 'translateX(0%)';
        sheets[n].style.zIndex = (n === front) ? 2 : 1;
      }
      busy = false;
    }, 320);
  }
}

book.addEventListener('touchstart', function(e){ if (e.touches.length === 1) startDrag(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
book.addEventListener('touchmove',  function(e){ if (e.touches.length === 1) moveDrag(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
book.addEventListener('touchend',   function(e){ const t = e.changedTouches[0]; endDrag(t.clientX, t.clientY); }, {passive:true});
book.addEventListener('touchcancel',function(){ mode = null; prepped = null; }, {passive:true});

book.addEventListener('mousedown', function(e){ startDrag(e.clientX, e.clientY); });
window.addEventListener('mousemove', function(e){ if (mode) moveDrag(e.clientX, e.clientY); });
window.addEventListener('mouseup',   function(e){ if (mode) endDrag(e.clientX, e.clientY); });

/* ---------- tap & keys ---------- */
book.addEventListener('click', function(){ if (!swiped) go(i + 1, true); });
book.addEventListener('keydown', function(e){ if (e.key === 'Enter') go(i + 1, true); });
document.addEventListener('keydown', function(e){
  if (e.key === 'ArrowRight' || e.key === ' '){ e.preventDefault(); go(i + 1, true); }
  if (e.key === 'ArrowLeft') go(i - 1, true);
});

els.back.addEventListener('click', function(e){ e.stopPropagation(); go(i - 1, true); });
els.restart.addEventListener('click', function(e){ e.stopPropagation(); go(0, true); });

/* The "Read to me" button is gone. It promised a voice that was never recorded
   for these pages: every beat's `audio` is empty, so every tap answered
   "Narration coming soon". A button that cannot do the thing it names is worse
   than no button, and it sat where a child's thumb lands. The narration itself
   lives on the devotional, which does have recordings. */

/* ---------- start ---------- */
try {
  const saved = parseInt(localStorage.getItem(KEY) || '0', 10);
  if (!isNaN(saved) && saved > 0 && saved < LAST) i = saved;
} catch(e){}

drawSheet(sheets[0], i);
drawSheet(sheets[1], Math.min(i + 1, LAST));
place(sheets[0], '0%', 2);
place(sheets[1], '0%', 1);
front = 0;
chrome();

function remeasure(){ sheets.forEach(function(el){ fitArt(el); syncMore(el); }); }
window.addEventListener('resize', remeasure);
window.addEventListener('orientationchange', function(){ setTimeout(remeasure, 280); });

STORY.beats.forEach(function(b){ if (b.img){ const im = new Image(); im.src = b.img; } });
</script>
</body>
</html>
