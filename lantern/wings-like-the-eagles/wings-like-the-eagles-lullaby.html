<!DOCTYPE html>
<!-- lantern/lullaby-template.html — the nightly lullaby page.
     A copy of www/a-brand-new-song-lullaby.html from the lst-app repo (the app's own
     song page: same design, same player, same behaviour, theme follows the app), with
     six slots the nightly fills - TITLE (three places), AUDIO, LULLABY, STORY_TITLE,
     STORY_NOTE and STORY_URL, each written as a double-underscored token in the page
     below. lullaby_page.py fills them; nothing else on the page changes per night.
     If the app's template changes, refresh this copy from lst-app. -->
<html lang="en" data-theme="navy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rise Up Like the Eagle · Little Scripture Travelers</title>
<!-- Fredoka and Nunito ship with the app, so they are served from the bundle. A
     stylesheet that never answers holds the whole document at "loading" - a blank
     page on a phone with no signal, exactly where this gets opened. -->
<link rel="stylesheet" href="fonts-embed.css">
<script>
/* Running inside the app: take the family's text size, learn how much room the
   floating tab bar needs, and keep a handle on the app for the back link. */
(function(){
  var q=new URLSearchParams(location.search);
  window.LST_FOOT=parseInt(q.get('appfoot')||'0',10)||0;
  window.LST_HOST=null;
  try{ if(window.parent && window.parent!==window && window.parent.lstBookBack) window.LST_HOST=window.parent; }catch(e){}
  try{
    var p=window.LST_HOST&&window.LST_HOST.LST_APP_PREFS;
    if(p&&p.size){
      var px={small:15,'default':16,large:18,xlarge:21}[p.size];
      if(px) document.documentElement.style.fontSize=px+'px';
    }
  }catch(e){}
})();
</script>
<style>
  /* ============================================================
     THEMES — sampled directly from the app's three modes so the
     lullaby page sits inside them without looking bolted on.
     ============================================================ */
  html[data-theme="navy"]{
    --bg:#1A284F; --surface:#253255; --surface-2:#23375C;
    --ink:#FFFFFF; --body-ink:#BCC4D9; --ink-soft:#9BA6C4;
    --accent:#EEC748; --quote:#EEC748;
    --teal:#7CD0DA;
    --edge:rgba(255,255,255,.10); --on-accent:#1F2D5C;
    --shadow:rgba(0,0,0,.30);
  }
  html[data-theme="dark"]{
    --bg:#0D1321; --surface:#1B1F2B; --surface-2:#182432;
    --ink:#FFFFFF; --body-ink:#B9BFCD; --ink-soft:#8F97A8;
    --accent:#EEC748; --quote:#EEC748;
    --teal:#7CD0DA;
    --edge:rgba(255,255,255,.09); --on-accent:#15162A;
    --shadow:rgba(0,0,0,.5);
  }
  html[data-theme="light"]{
    --bg:#F3F6FB; --surface:#FFFFFF; --surface-2:#F0FAFB;
    --ink:#1F2D5C; --body-ink:#3D4971; --ink-soft:#5E6A8C;
    --accent:#856B20; --quote:#856B20;
    /* the app's light-mode teal label is very faint on white;
       darkened here so every line stays readable */
    --teal:#0E6B78;
    --edge:rgba(31,45,92,.10); --on-accent:#FFFFFF;
    --shadow:rgba(31,45,92,.10);
  }

  :root{
    --beau:#8A4B2A; --scout:#4F9E5F; --willow:#8E63B5; --wren:#E0603C;
    --display:'Fredoka',system-ui,sans-serif;
    --body:'Nunito',system-ui,sans-serif;
    --shell:min(640px,100%);
    --fs:1.06rem;
  }
  html[data-theme="light"]{--beau:#7A3F20;--scout:#2F6B3C;--willow:#6A4790;--wren:#B23E1E}
  html[data-theme="navy"],html[data-theme="dark"]{--beau:#D89A6E;--scout:#7FCB8C;--willow:#B48FD8;--wren:#F0876A}

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth;background:var(--bg)}
  body{
    margin:0;padding:0 0 8.5rem;
    background:var(--bg);color:var(--ink);
    font-family:var(--body);
    display:flex;flex-direction:column;align-items:center;
  }

  /* ---------- header ---------- */
  .bar{
    position:sticky;top:0;z-index:20;width:100%;
    display:flex;justify-content:center;
    background:var(--bg);border-bottom:1px solid var(--edge);
    padding-top:env(safe-area-inset-top);
  }
  .bar-in{width:var(--shell);display:flex;align-items:center;gap:.4rem;padding:.6rem .9rem}
  .back{font:700 .78rem/1.2 var(--body);color:var(--body-ink);text-decoration:none;padding:.45rem .1rem;flex:0 1 auto;min-width:0;cursor:pointer}
  .tools{display:flex;gap:.3rem;flex:0 0 auto;margin-left:auto}
  .tool{
    font:700 .72rem/1 var(--body);color:var(--ink);
    background:var(--surface);border:1px solid var(--edge);
    border-radius:999px;padding:.5rem .62rem;cursor:pointer;
  }
  .tool:focus-visible,.back:focus-visible,.chip:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---------- title ---------- */
  .head{width:var(--shell);padding:1.4rem 1.15rem .2rem}
  .eyebrow-top{
    font:800 .74rem/1.3 var(--body);letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent);margin:0 0 .35rem;
  }
  h1{
    font:700 clamp(1.95rem,7.6vw,2.6rem)/1.08 var(--display);
    color:var(--ink);margin:0 0 .5rem;letter-spacing:-.5px;
  }
  .sub{font:400 1rem/1.6 var(--body);color:var(--body-ink);margin:0}

  /* ---------- cards ---------- */
  .card{
    background:var(--surface);
    border-radius:24px;
    padding:1.35rem 1.3rem;
    margin:0 0 1rem;
    box-shadow:0 2px 10px var(--shadow);
  }
  .card.teal{background:var(--surface-2)}
  .card .label{
    font:800 .74rem/1.3 var(--body);letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent);margin:0 0 .85rem;
    display:flex;align-items:center;gap:.55rem;
  }
  .card.teal .label{color:var(--teal)}
  .card .label b{width:9px;height:9px;border-radius:50%;background:currentColor;flex:0 0 auto}

  /* ---------- jump chips ---------- */
  .jump{width:var(--shell);display:flex;gap:.4rem;overflow-x:auto;padding:.8rem 1.15rem .3rem;scrollbar-width:none}
  .jump::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;font:700 .76rem/1 var(--body);color:var(--body-ink);
    background:var(--surface);border:1px solid var(--edge);
    border-radius:999px;padding:.6rem .85rem;cursor:pointer;white-space:nowrap;
  }
  .chip.on{color:var(--on-accent);background:var(--accent);border-color:var(--accent)}

  /* ---------- lyrics ---------- */
  main{width:var(--shell);padding:.5rem 1.15rem 0}
  section{scroll-margin-top:4.4rem}
  .verse{
    font:400 var(--fs)/1.75 var(--body);
    color:var(--body-ink);margin:0 0 1.15rem;white-space:pre-line;
  }
  .verse:last-child{margin-bottom:0}
  .quote{font-style:italic;color:var(--quote)}
  .card.teal .verse{color:var(--teal)}
  .t-beau .label{color:var(--beau)}
  .t-scout .label{color:var(--scout)}
  .t-willow .label{color:var(--willow)}
  .t-wren .label{color:var(--wren)}

  .dots{display:flex;gap:8px;justify-content:center;margin:1.6rem 0 .7rem}
  .dots span{width:11px;height:11px;border-radius:50%}
  .foot{width:var(--shell);text-align:center;font:400 .78rem/1.6 var(--body);color:var(--ink-soft);padding:0 1.15rem 1rem}


  /* ---------- resources ---------- */
  .card.resources .label{color:var(--accent)}
  a.res{
    display:block;text-decoration:none;
    background:var(--surface-2);border:1px solid var(--edge);
    border-radius:16px;padding:.85rem 2.1rem .85rem 1rem;
    margin:0 0 .55rem;position:relative;
  }
  a.res:last-child{margin-bottom:0}
  a.res:active{background:var(--surface)}
  .res-kind{
    display:block;font:800 .64rem/1 var(--body);letter-spacing:.16em;
    text-transform:uppercase;color:var(--accent);margin:0 0 .35rem;
  }
  .res-title{display:block;font:700 1rem/1.35 var(--display);color:var(--ink)}
  .res-note{display:block;font:400 .84rem/1.5 var(--body);color:var(--ink-soft);margin-top:.2rem}
  .res-go{
    position:absolute;right:1rem;top:50%;width:9px;height:9px;
    border-right:2.5px solid var(--teal);border-bottom:2.5px solid var(--teal);
    transform:translateY(-50%) rotate(-45deg);
  }

  /* ---------- floating controls ---------- */
  .float{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(1rem + env(safe-area-inset-bottom));z-index:30;
    display:flex;gap:.4rem;align-items:center;
    background:var(--surface);border:1px solid var(--edge);
    border-radius:999px;padding:.35rem;
    box-shadow:0 10px 26px var(--shadow);
  }
  .float button{
    font:700 .78rem/1 var(--body);color:var(--ink);
    background:none;border:0;border-radius:999px;
    padding:.62rem .8rem;cursor:pointer;white-space:nowrap;
  }
  .float button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
  /* the Play pill, as it was — gold outline, gold type */
  .float .progress{
    position:absolute;left:.9rem;right:.9rem;bottom:.28rem;
    height:2px;border-radius:2px;background:var(--edge);overflow:hidden;
  }
  .float .progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s linear}
  .float button.play{
    border:1px solid var(--accent);
    color:var(--accent);
    padding:.62rem 1rem;
  }

  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *{transition:none!important}
  }

  /* ── Bottom link out to the music file ── */
  .music-link{
    width:var(--shell);margin:1.9rem auto .2rem;box-sizing:border-box;
    display:flex;align-items:center;gap:.8rem;
    padding:.9rem 1.05rem;
    background:var(--surface);border:1px solid var(--accent);
    border-radius:16px;text-decoration:none;
    box-shadow:0 6px 18px var(--shadow);
  }
  .music-link:active{transform:translateY(1px)}
  .music-link-icon{font-size:1.4rem;line-height:1;color:var(--accent);flex:0 0 auto}
  .music-link-txt{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1 1 auto}
  .music-link-txt b{font:700 .96rem/1.25 var(--display);color:var(--accent)}
  .music-link-txt i{font:400 .78rem/1.4 var(--body);font-style:normal;color:var(--ink-soft)}
  .music-link-arrow{color:var(--accent);font-size:1rem;flex:0 0 auto}

  /* ============================================================
     LANTERN PLAYER
     Every colour is pulled from the page's own theme variables,
     so the player follows navy / dark / light with the rest of
     the page. The only numbers below are geometry.
     ============================================================ */
  .lp-root{
    --lp-bg:var(--bg);
    --lp-surface:var(--surface);
    --lp-surface-2:var(--surface-2);
    --lp-ink:var(--ink);
    --lp-soft:var(--body-ink);
    --lp-faint:var(--ink-soft);
    --lp-accent:var(--accent);
    --lp-teal:var(--teal);
    --lp-edge:var(--edge);
    --lp-shadow:var(--shadow);
    --lp-on-accent:var(--on-accent);

    /* clearance for the floating pill the mini bar sits above */
    --lp-dock:3.15rem;
    --lp-gap:1rem;

    --lp-ease:cubic-bezier(.32,.72,0,1);
  }

  .lp-root{
    position:fixed;inset:0;z-index:40;pointer-events:none;
    font-family:var(--body);
  }
  .lp-root *{box-sizing:border-box}
  .lp-root button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .lp-root button:focus-visible{outline:2px solid var(--lp-accent);outline-offset:3px;border-radius:10px}
  .lp-off{display:none!important}

  /* ---------- mini bar ---------- */
  .lp-mini{
    position:absolute;pointer-events:auto;
    left:50%;width:min(640px,calc(100% - 1.5rem));
    bottom:calc(var(--lp-dock) + var(--lp-gap) + .55rem + env(safe-area-inset-bottom));
    height:64px;border-radius:20px;
    background:var(--lp-surface);border:1px solid var(--lp-edge);
    box-shadow:0 10px 30px var(--lp-shadow);
    display:flex;align-items:center;gap:.6rem;padding:0 .5rem 0 .35rem;
    color:var(--lp-ink);
    transform:translateX(-50%) translateY(150%);opacity:0;
    transition:transform .42s var(--lp-ease),opacity .28s ease;
  }
  .lp-root[data-mini="true"] .lp-mini{transform:translateX(-50%) translateY(0);opacity:1}

  .lp-mini__grab{position:absolute;inset:0;border-radius:20px;z-index:0}
  .lp-mini > *:not(.lp-mini__grab){position:relative;z-index:1}
  .lp-mini__close{padding:.5rem;line-height:0;color:var(--lp-faint);flex:0 0 auto}
  .lp-mini__art{width:44px;height:44px;border-radius:10px;overflow:hidden;flex:0 0 auto}
  .lp-mini__art svg,.lp-mini__art img{width:100%;height:100%;display:block;object-fit:cover}
  .lp-mini__meta{flex:1 1 auto;min-width:0;text-align:left}
  .lp-mini__title{font:700 .95rem/1.25 var(--display);color:var(--lp-ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lp-mini__sub{font:400 .76rem/1.35 var(--body);color:var(--lp-faint);margin-top:1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lp-mini__btn{padding:.55rem;line-height:0;color:var(--lp-ink);flex:0 0 auto}
  .lp-mini__line{
    position:absolute;left:.9rem;right:.9rem;bottom:.4rem;height:2px;
    border-radius:2px;background:var(--lp-edge);overflow:hidden;z-index:1;
  }
  .lp-mini__line i{display:block;height:100%;width:0;background:var(--lp-accent)}

  /* ---------- full sheet ---------- */
  .lp-sheet{
    position:absolute;inset:0;pointer-events:auto;
    background:var(--lp-bg);color:var(--lp-ink);
    display:flex;flex-direction:column;align-items:center;
    padding:env(safe-area-inset-top) 0 calc(1.1rem + env(safe-area-inset-bottom));
    transform:translateY(100%);
    transition:transform .46s var(--lp-ease);
    overflow:hidden;
  }
  .lp-root[data-open="true"] .lp-sheet{transform:translateY(0)}
  .lp-sheet::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(125% 62% at 50% 0%,var(--lp-surface) 0%,transparent 74%);
  }
  .lp-in{
    position:relative;width:var(--shell);max-width:100%;
    padding:0 1.15rem;flex:1 1 auto;min-height:0;
    display:flex;flex-direction:column;
  }

  /* header */
  .lp-head{display:flex;align-items:center;gap:.7rem;padding:.85rem 0 .5rem;flex:0 0 auto}
  .lp-round{
    width:38px;height:38px;border-radius:50%;flex:0 0 auto;
    background:var(--lp-surface);border:1px solid var(--lp-edge);
    display:grid;place-items:center;color:var(--lp-ink);
  }
  .lp-tabs{flex:1 1 auto;display:flex;padding:3px;border-radius:999px;
    background:var(--lp-surface);border:1px solid var(--lp-edge)}
  .lp-tab{flex:1;padding:.5rem .25rem;border-radius:999px;
    font:700 .84rem/1 var(--body);color:var(--lp-faint);
    transition:background .2s ease,color .2s ease}
  .lp-tab[aria-selected="true"]{background:var(--lp-accent);color:var(--lp-on-accent)}

  /* panels */
  .lp-panels{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
  .lp-panel{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
  .lp-panel[hidden]{display:none}

  /* artwork */
  .lp-artwrap{flex:1 1 auto;display:grid;place-items:center;min-height:0;padding:.5rem 0}
  .lp-art{
    width:min(68vw,286px);aspect-ratio:1;border-radius:24px;overflow:hidden;
    box-shadow:0 22px 54px var(--lp-shadow);
    transition:transform .5s var(--lp-ease);
  }
  .lp-art svg,.lp-art img{width:100%;height:100%;display:block;object-fit:cover}
  .lp-root[data-playing="false"] .lp-art{transform:scale(.9)}

  /* meta */
  .lp-meta{text-align:center;padding:.4rem 0 .1rem;flex:0 0 auto}
  .lp-meta__title{font:700 clamp(1.4rem,5.6vw,1.75rem)/1.18 var(--display);
    color:var(--lp-ink);letter-spacing:-.4px}
  .lp-meta__sub{font:400 .88rem/1.45 var(--body);color:var(--lp-faint);margin-top:.3rem}

  /* transport */
  .lp-transport{display:flex;align-items:center;justify-content:space-evenly;
    padding:1rem .1rem .3rem;flex:0 0 auto}
  .lp-tbtn{padding:.45rem;line-height:0;color:var(--lp-ink)}
  .lp-tbtn--play{padding:.1rem;color:var(--lp-accent)}

  /* scrubber */
  .lp-scrub{padding:.3rem 0 0;flex:0 0 auto}
  .lp-range{-webkit-appearance:none;appearance:none;width:100%;height:22px;
    background:transparent;cursor:pointer;display:block}
  .lp-range::-webkit-slider-runnable-track{height:6px;border-radius:3px;
    background:linear-gradient(to right,var(--lp-teal) var(--lp-pct,0%),var(--lp-edge) var(--lp-pct,0%))}
  .lp-range::-moz-range-track{height:6px;border-radius:3px;background:var(--lp-edge)}
  .lp-range::-moz-range-progress{height:6px;border-radius:3px;background:var(--lp-teal)}
  .lp-range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
    width:26px;height:18px;border-radius:9px;background:var(--lp-ink);
    margin-top:-6px;box-shadow:0 2px 6px var(--lp-shadow)}
  .lp-range::-moz-range-thumb{width:26px;height:18px;border:0;border-radius:9px;
    background:var(--lp-ink);box-shadow:0 2px 6px var(--lp-shadow)}
  .lp-times{display:flex;justify-content:space-between;
    font:400 .74rem/1 var(--body);color:var(--lp-faint);
    font-variant-numeric:tabular-nums;margin-top:-.1rem}

  /* utility row */
  .lp-utils{display:flex;align-items:flex-start;justify-content:space-evenly;
    padding:1.15rem .1rem .2rem;flex:0 0 auto}
  .lp-ubtn{display:flex;flex-direction:column;align-items:center;gap:.25rem;
    min-width:46px;color:var(--lp-faint);transition:color .2s ease}
  .lp-ubtn[data-active="true"]{color:var(--lp-accent)}
  .lp-ubtn__label{font:800 .6rem/1 var(--body);letter-spacing:.04em;
    font-variant-numeric:tabular-nums;min-height:.66rem}
  .lp-ubtn__text{font:700 .95rem/1 var(--body)}

  /* queue */
  .lp-queue{overflow-y:auto;padding:.3rem 0 .6rem;-webkit-overflow-scrolling:touch}
  .lp-qitem{display:flex;align-items:center;gap:.75rem;width:100%;
    padding:.65rem .35rem;text-align:left;border-bottom:1px solid var(--lp-edge)}
  .lp-qitem:last-child{border-bottom:0}
  .lp-qitem__art{width:40px;height:40px;border-radius:9px;overflow:hidden;flex:0 0 auto}
  .lp-qitem__art svg,.lp-qitem__art img{width:100%;height:100%;display:block;object-fit:cover}
  .lp-qitem__meta{min-width:0;flex:1 1 auto}
  .lp-qitem__title{display:block;font:700 .92rem/1.3 var(--display);color:var(--lp-ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lp-qitem__sub{display:block;font:400 .76rem/1.35 var(--body);color:var(--lp-faint);
    margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lp-qitem__now{color:var(--lp-teal);flex:0 0 auto;line-height:0}
  .lp-qempty{padding:1.1rem .35rem;font:400 .88rem/1.6 var(--body);color:var(--lp-faint)}

  /* menus */
  .lp-scrim{position:absolute;inset:0;pointer-events:auto;
    background:rgba(0,0,0,.55);opacity:0;transition:opacity .28s ease}
  .lp-menu{position:absolute;pointer-events:auto;
    left:50%;width:min(560px,calc(100% - 1.5rem));
    bottom:calc(.9rem + env(safe-area-inset-bottom));
    background:var(--lp-surface);border:1px solid var(--lp-edge);
    border-radius:22px;overflow:hidden;color:var(--lp-ink);
    transform:translateX(-50%) translateY(120%);
    transition:transform .38s var(--lp-ease);
    box-shadow:0 -10px 40px var(--lp-shadow)}
  .lp-root[data-menu="true"] .lp-scrim{opacity:1}
  .lp-root[data-menu="true"] .lp-menu{transform:translateX(-50%) translateY(0)}
  .lp-menu__title{padding:1rem 1.15rem .6rem;
    font:800 .7rem/1.3 var(--body);letter-spacing:.14em;text-transform:uppercase;
    color:var(--lp-accent)}
  .lp-menu__item{display:flex;align-items:center;justify-content:space-between;width:100%;
    padding:.85rem 1.15rem;font:400 1rem/1.4 var(--body);text-align:left;
    border-top:1px solid var(--lp-edge);color:var(--lp-ink)}
  .lp-menu__item[data-selected="true"]{color:var(--lp-accent);font-weight:700}
  .lp-menu__cancel{width:100%;padding:.9rem;font:700 .95rem/1 var(--body);
    border-top:1px solid var(--lp-edge);color:var(--lp-faint)}

  @media (prefers-reduced-motion:reduce){
    .lp-root *,.lp-root *::before{transition-duration:.01ms!important}
  }

  /* the bottom card is now a button, not a link */
  button.music-link{width:var(--shell);text-align:left;cursor:pointer;font:inherit}

  /* ---- inside the app ---- */
  body.in-app .float{bottom:calc(1rem + var(--appfoot,0px) + env(safe-area-inset-bottom))}
  body.in-app{padding-bottom:calc(var(--appfoot,0px) + 1rem)}
  body.in-app .back{display:none}
  body.in-app .bar{padding-top:.35rem;padding-bottom:.1rem}
  body.in-app .bar-in{justify-content:flex-end}
  /* The page's own Lantern Player: its mini bar and its full sheet both anchor
     to the bottom of the screen, which is where the app's tab bar floats. */
  body.in-app .lp-mini{bottom:calc(var(--lp-dock) + var(--lp-gap) + .55rem + var(--appfoot,0px) + env(safe-area-inset-bottom))}
  body.in-app .lp-sheet{padding-bottom:calc(1.1rem + var(--appfoot,0px) + env(safe-area-inset-bottom))}
  /* One song, one player on screen: while the full sheet is up, the mini bar
     yields, and slides back the moment the sheet drops. */
  .lp-root[data-open="true"] .lp-mini{opacity:0 !important;pointer-events:none !important;
      transform:translateX(-50%) translateY(160%) !important}

<script>
/* ============================================================
   ADMIN BLOCK — the only part you change each day.

   audio     : path to the mp3, e.g. "audio/travelers-lullaby.mp3"
               Leave null and the Play button opens a file picker
               so you can test an mp3 straight off your phone.
   theme     : "auto" follows the device/app mode.
               Force one with "navy", "dark" or "light".
   ============================================================ */
const LULLABY = {
 "title": "Rise Up Like the Eagle",
 "subtitle": "Sing it slow. The words are for you — the calm is for them.",
 "artist": "Little Scripture Travelers",
 "song": {
  "url": "",
  "id": "",
  "title": "Rise Up Like the Eagle"
 },
 "theme": "auto",
 "backUrl": "",
 "parts": [
  {
   "id": "v1",
   "label": "Verse 1",
   "kind": "verse",
   "stanzas": [
    "The people said the road was long,\nTheir legs were worn and sore;\nIsaiah said, \"The Lord's not tired,\nHe made the farthest shore.\""
   ]
  },
  {
   "id": "c1",
   "label": "Chorus",
   "kind": "chorus",
   "stanzas": [
    "CHORUS"
   ]
  },
  {
   "id": "v2",
   "label": "Verse 2",
   "kind": "verse",
   "stanzas": [
    "Even the strong young men fall down,\nThe fastest runners too;\nThey stop and sit down in the dust,\nAnd so, my love, do you."
   ]
  },
  {
   "id": "c2",
   "label": "Chorus",
   "kind": "chorus",
   "stanzas": [
    "CHORUS"
   ]
  },
  {
   "id": "v3",
   "label": "Verse 3",
   "kind": "verse",
   "stanzas": [
    "The walk home from the park is long,\nAnd Beau's small legs just ache;\nHe breathes three slow breaths, holds Dad's hand,\nAnd finds one more to take."
   ]
  },
  {
   "id": "c3",
   "label": "Chorus",
   "kind": "chorus",
   "stanzas": [
    "CHORUS"
   ]
  },
  {
   "id": "v4",
   "label": "Verse 4",
   "kind": "verse",
   "stanzas": [
    "So when your legs are all worn out\nAnd you can't take one more,\nWhisper, \"Heavenly Father, please,\"\nHe has new strength in store."
   ]
  },
  {
   "id": "c4",
   "label": "Chorus",
   "kind": "chorus",
   "stanzas": [
    "CHORUS"
   ]
  }
 ],
 "chorus": "But wait upon the Lord, my love,\nAnd new strength you will find;\nYou'll rise up with the eagle's wings\nAnd leave the dust behind.",
 "timing": [
  9.22,
  13.66,
  18.2,
  22.58,
  29.3,
  33.7,
  38.24,
  42.62,
  52.0,

 ]
};

/* ============================================================
   RESOURCES — the "More for Tonight" card at the bottom.

   url : where each piece lives once it is uploaded. The
         defaults below are plain filenames, which work if all
         three sit in the same folder. Swap in your real app
         paths (e.g. "/resources/travelers-lullaby") and
         nothing else needs to change.
   kind : the little gold tag — "Lullaby", "Story", "Printable"…
   Remove an item, or the whole list, and the card disappears.
   ============================================================ */
const RESOURCES = {
  label: "More for Tonight",
  items: [
    { kind: "Story",
      title: "Wings Like the Eagles",
      note:  "Tonight's illustrated story — Isaiah 40:28–31.",
      url:   "wings-like-the-eagles.html" },
    { kind: "Lullaby",
      title: "A Little Travelers’ Lullaby",
      note:  "All four Travelers, one verse each. Sing it slow.",
      url:   "travelers-lullaby.html" }
  ]
};

/* ============================================================
   THEME — set by the app, never chosen on this page.

   The app tells the page which of its three modes is active,
   by any of:

     1. a query string:   ...travelers-lullaby.html?theme=navy
     2. a shared key:     localStorage['lst:theme'] = 'navy'
     3. a live message:   postMessage({type:'lst:theme', mode:'navy'})

   Sending it any of 'navy', 'dark' or 'light' switches the page.
   If nothing arrives, it falls back to LULLABY.theme, and 'auto'
   follows the phone's light/dark setting as a last resort.
   ============================================================ */
const MODES = ['auto','navy','dark','light'];
const sysDark = window.matchMedia('(prefers-color-scheme: dark)');

function validMode(m){ return m && MODES.indexOf(m) > -1 ? m : null; }

function modeFromApp(){
  try {
    const q = validMode(new URLSearchParams(window.location.search).get('theme'));
    if (q) return q;
  } catch(e){}
  try {
    const shared = validMode(localStorage.getItem('lst:theme'));
    if (shared) return shared;
  } catch(e){}
  return null;
}

let mode = modeFromApp() || LULLABY.theme;

function applyMode(){
  const m = (mode === 'auto') ? (sysDark.matches ? 'dark' : 'light') : mode;
  document.documentElement.setAttribute('data-theme', m);
}

sysDark.addEventListener('change', function(){ if (mode === 'auto') applyMode(); });

/* the app can switch mode while this page is open */
window.addEventListener('message', function(e){
  const d = e.data;
  if (!d || d.type !== 'lst:theme') return;
  const m = validMode(d.mode);
  if (m){ mode = m; applyMode(); }
});
window.addEventListener('storage', function(e){
  if (e.key !== 'lst:theme') return;
  const m = validMode(e.newValue);
  if (m){ mode = m; applyMode(); }
});

applyMode();

/* ============================================================
   LYRICS
   ============================================================ */
document.getElementById('title').textContent = LULLABY.title;
document.getElementById('subtitle').textContent = LULLABY.subtitle;

/* ---------- back link ----------
   A bare href="#" is a link to the top of the document, so tapping the
   header used to scroll the page up. The link now only navigates when
   there is somewhere real to go. */
(function(){
  const back = document.getElementById('backLink');
  if (!back) return;
  const dest = (LULLABY.backUrl || '').trim();

  if (dest && dest !== '#'){ back.href = dest; return; }

  back.removeAttribute('href');
  back.setAttribute('role', 'button');
  back.setAttribute('tabindex', '0');

  function goBack(e){
    if (e) e.preventDefault();
    if (typeof window.LSTApp !== 'undefined' && window.LSTApp.back){
      window.LSTApp.back(); return;
    }
    if (window.parent !== window){
      window.parent.postMessage({type:'lst:back'}, '*'); return;
    }
    if (window.history.length > 1){ window.history.back(); return; }
    /* nowhere to go: stay put rather than jump to the top */
  }

  back.addEventListener('click', goBack);
  back.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' ') goBack(e);
  });
})();


function stanzaHTML(s){
  return '<p class="verse">' + (s === 'CHORUS' ? LULLABY.chorus : s) + '</p>';
}
function partHTML(p){
  const body = p.stanzas.map(stanzaHTML).join('');
  const cls = 'card' + (p.kind === 'chorus' ? ' teal' : '') + (p.tone ? ' t-' + p.tone : '');
  return '<section id="p-' + p.id + '" class="' + cls + '">' +
         '<p class="label"><b></b>' + p.label + '</p>' + body +
         '</section>';
}

/* ---------- resources card ---------- */
function resourcesHTML(){
  if (!RESOURCES || !RESOURCES.items || !RESOURCES.items.length) return '';
  const rows = RESOURCES.items.map(function(r){
    return '<a class="res" href="' + r.url + '">' +
             '<span class="res-kind">' + r.kind + '</span>' +
             '<span class="res-title">' + r.title + '</span>' +
             (r.note ? '<span class="res-note">' + r.note + '</span>' : '') +
             '<span class="res-go" aria-hidden="true"></span>' +
           '</a>';
  }).join('');
  return '<section id="p-resources" class="card resources">' +
         '<p class="label"><b></b>' + RESOURCES.label + '</p>' + rows +
         '</section>';
}

document.getElementById('lyrics').innerHTML = LULLABY.parts.map(partHTML).join('') + resourcesHTML();

const jump = document.getElementById('jump');
let sawChorus = false;
LULLABY.parts.forEach(function(p){
  if (p.kind === 'chorus'){ if (sawChorus) return; sawChorus = true; }
  const c = document.createElement('button');
  c.className = 'chip';
  c.textContent = p.label;
  c.dataset.target = 'p-' + p.id;
  c.addEventListener('click', function(){
    const el = document.getElementById(c.dataset.target);
    if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
  });
  jump.appendChild(c);
});

/* one last chip for the resources card */
if (document.getElementById('p-resources')){
  const rc = document.createElement('button');
  rc.className = 'chip';
  rc.textContent = RESOURCES.label;
  rc.dataset.target = 'p-resources';
  rc.addEventListener('click', function(){
    const el = document.getElementById(rc.dataset.target);
    if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
  });
  jump.appendChild(rc);
}

const chips = [].slice.call(document.querySelectorAll('.chip'));
if ('IntersectionObserver' in window){
  const obs = new IntersectionObserver(function(en){
    en.forEach(function(e){
      if (!e.isIntersecting) return;
      chips.forEach(function(c){ c.classList.toggle('on', c.dataset.target === e.target.id); });
    });
  }, {rootMargin:'-30% 0px -60% 0px'});
  LULLABY.parts.forEach(function(p){
    const el = document.getElementById('p-' + p.id);
    if (el) obs.observe(el);
  });
}

/* ---------- text size ----------
   Also honours the app: localStorage['lst:textSize'] = 0-3,
   or postMessage({type:'lst:textSize', size:2}). The A- / A+
   buttons stay for a parent reading in a dark room. */
const SIZES = [0.94, 1.06, 1.22, 1.40];
let size = 1;
try {
  const app = parseInt(localStorage.getItem('lst:textSize'), 10);
  const own = parseInt(localStorage.getItem('lst:lullaby:size'), 10);
  const pick = !isNaN(own) ? own : app;
  if (!isNaN(pick)) size = Math.max(0, Math.min(3, pick));
} catch(e){}
function applySize(){
  document.documentElement.style.setProperty('--fs', SIZES[size] + 'rem');
}
function saveSize(){
  try { localStorage.setItem('lst:lullaby:size', String(size)); } catch(e){}
}
window.addEventListener('message', function(e){
  const d = e.data;
  if (!d || d.type !== 'lst:textSize') return;
  const s = parseInt(d.size, 10);
  if (!isNaN(s)){ size = Math.max(0, Math.min(3, s)); applySize(); }
});
document.getElementById('bigger').addEventListener('click', function(){ size = Math.min(3, size + 1); applySize(); saveSize(); });
document.getElementById('smaller').addEventListener('click', function(){ size = Math.max(0, size - 1); applySize(); saveSize(); });
applySize();

/* ---------- hands-free scroll ---------- */
const scrollBtn = document.getElementById('scrollBtn');
let creeping = false, raf = null, carry = 0, last = 0;
function step(now){
  if (!creeping) return;
  if (!last) last = now;
  carry += (now - last) / 1000 * 16;
  last = now;
  if (carry >= 1){
    const whole = Math.floor(carry); carry -= whole;
    window.scrollBy(0, whole);
    if ((window.innerHeight + window.scrollY) >= document.body.scrollHeight - 2) return stopCreep();
  }
  raf = requestAnimationFrame(step);
}
function startCreep(){
  creeping = true; last = 0; carry = 0;
  scrollBtn.setAttribute('aria-pressed','true');
  scrollBtn.textContent = 'Stop scroll';
  raf = requestAnimationFrame(step);
}
function stopCreep(){
  creeping = false;
  if (raf) cancelAnimationFrame(raf);
  raf = null;
  scrollBtn.setAttribute('aria-pressed','false');
  scrollBtn.textContent = 'Auto-scroll';
}
scrollBtn.addEventListener('click', function(e){ e.stopPropagation(); if (creeping) stopCreep(); else startCreep(); });
['touchstart','wheel','keydown'].forEach(function(ev){
  window.addEventListener(ev, function(){ if (creeping) stopCreep(); }, {passive:true});
});
/* ============================================================
   PLAY

   The lullaby is embedded in this file, so it plays straight from
   the page and keeps working with no signal.

   If LULLABY.song.url is set, the app takes over instead: the page
   hands the song off rather than playing it, so the app's own
   player runs it. Leave song.url empty to use the built-in track.
   ============================================================ */
document.getElementById('topBtn').addEventListener('click', function(){
  stopCreep(); window.scrollTo({top:0, behavior:'smooth'});
});

/* If LULLABY.song.url is set, the app plays the track and this page's
   own player never opens. Otherwise the embedded lullaby plays here. */
function handOffToApp(song){
  const payload = {
    type: 'lst:play',
    id: song.id || null,
    url: song.url || null,
    title: song.title || LULLABY.title,
    artist: LULLABY.artist
  };
  if (typeof window.LSTApp !== 'undefined' && window.LSTApp.play){ window.LSTApp.play(payload); return; }
  if (window.parent !== window){ window.parent.postMessage(payload, '*'); return; }
  window.location.href = song.url;
}

if ((LULLABY.song || {}).url){
  document.querySelectorAll('[data-lantern-open]').forEach(function(b){
    b.addEventListener('click', function(e){
      e.preventDefault();
      e.stopImmediatePropagation();
      handOffToApp(LULLABY.song);
    }, true);
  });
}


</script>

  ["mousedown", "touchstart", "keydown"].forEach(function (ev) {
    range.addEventListener(ev, function () { S.scrubbing = true; });
  });
  range.addEventListener("input", function () {
    range.style.setProperty("--lp-pct", (range.value / 10) + "%");
    var d = audio.duration;
    if (isFinite(d) && d > 0) {
      var c = (range.value / 1000) * d;
      elapsed.textContent = pad(c);
      remain.textContent = "-" + mmss(Math.max(0, d - c));
    }
  });
  ["change", "mouseup", "touchend", "keyup"].forEach(function (ev) {
    range.addEventListener(ev, function () {
      if (!S.scrubbing) return;
      var d = audio.duration;
      if (isFinite(d) && d > 0) audio.currentTime = (range.value / 1000) * d;
      S.scrubbing = false;
    });
  });

  btnSpeed.addEventListener("click", function () {
    openMenu("Playback speed", PLAYER.speeds.map(function (s) {
      return { label: s + "\u00D7", on: s === S.speed };
    }), function (i) {
      S.speed = PLAYER.speeds[i];
      audio.playbackRate = S.speed;
      speedText.textContent = S.speed + "x";
      btnSpeed.setAttribute("data-active", S.speed === 1 ? "false" : "true");
    });
  });

  btnSleep.addEventListener("click", function () {
    var items = PLAYER.sleepOptions.map(function (m) {
      return {
        label: m === 0 ? "When the lullaby ends" : m + " minutes",
        on: m === 0 ? S.sleepAtEnd : S.sleepMin === m
      };
    });
    items.push({ label: "Off", on: !S.sleepAtEnd && !S.sleepEnd });
    openMenu("Sleep timer", items, function (i) {
      if (i === items.length - 1) clearSleep();
      else setSleep(PLAYER.sleepOptions[i]);
    });
  });

  if (btnShuffle) btnShuffle.addEventListener("click", function () {
    S.shuffle = !S.shuffle;
    btnShuffle.setAttribute("data-active", S.shuffle ? "true" : "false");
    buildOrder(); renderQueue();
  });

  /* one track: off ↔ one.  more than one: off → all → one */
  btnRepeat.addEventListener("click", function () {
    if (!multi) S.repeat = S.repeat === "off" ? "one" : "off";
    else S.repeat = S.repeat === "off" ? "all" : S.repeat === "all" ? "one" : "off";
    audio.loop = false;
    renderRepeat();
  });

  if (!btnAir.classList.contains("lp-off")) {
    btnAir.addEventListener("click", function () { audio.remote.prompt().catch(function () {}); });
  }

  $(".lp-more").addEventListener("click", function () {
    openMenu("Options", [
      { label: "Start the lullaby over" },
      { label: "Playback speed" },
      { label: "Sleep timer" }
    ], function (i) {
      if (i === 0) { audio.currentTime = 0; play(); }
      if (i === 1) setTimeout(function () { btnSpeed.click(); }, 360);
      if (i === 2) setTimeout(function () { btnSleep.click(); }, 360);
    });
  });

  /* ---------- audio events ---------- */
  audio.addEventListener("play", function () { renderPlaying(true); });
  audio.addEventListener("pause", function () { renderPlaying(false); });
  audio.addEventListener("timeupdate", renderTime);
  audio.addEventListener("loadedmetadata", renderTime);
  audio.addEventListener("durationchange", renderTime);
  audio.addEventListener("ended", function () {
    if (S.sleepAtEnd) { clearSleep(); renderPlaying(false); return; }
    if (S.repeat === "one") { audio.currentTime = 0; play(); return; }
    if (S.repeat === "all" && multi) { step(1); return; }
    if (multi) { step(1); return; }
    renderPlaying(false);
    miniFill.style.width = "0";
  });

  if ("mediaSession" in navigator) {
    var ms = navigator.mediaSession;
    try {
      ms.setActionHandler("play", play);
      ms.setActionHandler("pause", function () { audio.pause(); });
      ms.setActionHandler("seekbackward", function () { btnBack.click(); });
      ms.setActionHandler("seekforward", function () { btnFwd.click(); });
      if (multi) {
        ms.setActionHandler("nexttrack", function () { step(1); });
        ms.setActionHandler("previoustrack", function () { step(-1); });
      }
    } catch (e) {}
  }

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (root.getAttribute("data-menu") === "true") closeMenu();
    else if (root.getAttribute("data-open") === "true") closeSheet();
  });

  /* ---------- go ---------- */
  buildOrder();
  renderRepeat();
  renderSleep();
  renderPlaying(false);
  speedText.textContent = "1x";
  renderTrack();

  window.LanternPlayer = {
    show: showMini,
    open: function () { showMini(); openSheet(); },
    dismiss: dismiss,
    setQueue: function (q) { PLAYER.queue = q; S.index = 0; S.ready = false; buildOrder(); renderQueue(); }
  };
})();
</script>


<script>
/* ---- Standing inside the app, on another origin ----
   Loaded straight from the website into the app's frame (a phone with no copy
   of this page and no answer from the account), the app cannot reach in to dress
   it. It says so in the address instead - ?inapp=1 - and the page does for
   itself what the app does for the Lantern lullaby: the app's theme, no back
   bar, and one big Play button in place of the floating pill (THE SONG RULE). */
(function(){
  if(window.LST_HOST) return;
  var q; try{ q=new URLSearchParams(location.search); }catch(e){ return; }
  if(q.get('inapp')!=='1') return;
  document.body.classList.add('in-app');
  if(window.LST_FOOT) document.documentElement.style.setProperty('--appfoot', window.LST_FOOT+'px');
  var st=document.createElement('style');
  st.textContent='.float,.lp-mini,.music-link{display:none !important}';
  document.head.appendChild(st);
  /* The app's headphone bubble plays the song; this page is the words. */
})();
/* ---- Standing inside the app ---- */
(function(){
  if(!window.LST_HOST) return;
  document.body.classList.add('in-app');
  if(window.LST_FOOT) document.documentElement.style.setProperty('--appfoot', window.LST_FOOT+'px');
  var back=document.getElementById('backLink')||document.querySelector('.back');
  if(back){
    back.setAttribute('href','#');
    back.addEventListener('click',function(e){
      e.preventDefault();
      try{ window.LST_HOST.lstBookBack(); }catch(err){}
    });
  }
  try{ window.LST_HOST.lstBookInfo({title:document.title.split(/\s+[\u00b7|]\s+/)[0].trim()}); }catch(e){}
})();
</script>
