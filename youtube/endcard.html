<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Fredoka;src:url(fonts/Fredoka.ttf)}
@font-face{font-family:Nunito;src:url(fonts/Nunito.ttf)}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0d1530;font-family:Nunito,sans-serif}
#bg{position:absolute;inset:0;background:
  radial-gradient(ellipse 45% 55% at 24% 50%, rgba(255,214,140,.20), rgba(255,214,140,0) 70%),
  radial-gradient(ellipse at 50% 40%, #233466 0%, #141f45 55%, #0a1028 100%)}
.star{position:absolute;border-radius:50%;background:#fff6d8}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.5) 100%)}
.el{position:absolute;opacity:0}
#cover{left:130px;top:150px;width:640px;height:640px;border-radius:6px;box-shadow:0 30px 60px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08)}
#cover img{width:100%;height:100%;border-radius:6px;display:block}
#coverTag{left:130px;top:812px;width:640px;text-align:center;color:#f5c542;font:700 26px Fredoka;letter-spacing:.04em}
#right{left:860px;top:110px;width:960px}
.eyebrow{color:#f5c542;font:600 26px Fredoka;letter-spacing:.14em;text-transform:uppercase}
h1{margin:6px 0 0;color:#fff;font:600 84px/1.05 Fredoka}
.lead{margin-top:14px;color:#e9edff;font:600 34px/1.35 Nunito}
.lead b{color:#7fd6c9}
#tiles{left:860px;top:430px;display:flex;gap:28px}
.tile{width:290px;background:#fbf7ea;border-radius:22px;padding:18px 18px 16px;box-sizing:border-box;text-align:center;border:3px solid #f5c542;opacity:0}
.tile img{width:200px;height:200px;display:block;margin:0 auto}
.tile .t{margin-top:10px;font:600 27px Fredoka;color:#14204a}
.tile .s{margin-top:2px;font:700 19px Nunito;color:#3a8f5a;word-break:break-all}
#links{left:860px;top:800px;width:960px;color:#cfd6f5;font:700 26px Nunito}
#bar{left:0;top:900px;width:1920px;height:130px;display:flex;justify-content:center;align-items:center;gap:34px}
.pill{display:flex;align-items:center;gap:14px;padding:16px 34px;border-radius:999px;font:600 36px Fredoka;color:#fff;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35)}
.pill svg{width:40px;height:40px;fill:#fff}
.pill.sub{background:#e62117;border-color:#e62117}
</style></head><body>
<div id="bg"></div><div id="stars"></div>
<div class="el" id="cover"><img id="coverImg" src="pages/front.png"></div>
<div class="el" id="coverTag"></div>
<div class="el" id="right">
  <div class="eyebrow" id="eyebrow">Paperback now on Amazon</div>
  <h1 id="bookTitle"></h1>
  <div class="lead" id="lead">A story a day that lines up with <b>Come, Follow Me</b>.<br>Read them all in the app or on our website, too.</div>
</div>
<div class="el" id="tiles" style="opacity:1">
  <div class="tile" id="t1"><img src="qr_amazon.png"><div class="t">Paperback</div><div class="s">Amazon.com</div></div>
  <div class="tile" id="t2"><img src="qr_app.png"><div class="t">iPhone &amp; iPad App</div><div class="s">App Store</div></div>
  <div class="tile" id="t3"><img src="qr_web.png"><div class="t">Website</div><div class="s">littlescripturetravelers.com</div></div>
</div>
<div class="el" id="links">Scan with your phone camera · All links are in the description</div>
<div class="el" id="bar">
  <div class="pill" id="b1"><svg viewBox="0 0 24 24"><path d="M2 21h4V9H2v12zm20-11c0-1.1-.9-2-2-2h-6.3l1-4.6v-.3c0-.4-.2-.8-.4-1.1L13.2 1 6.6 7.6C6.2 8 6 8.5 6 9v10c0 1.1.9 2 2 2h9c.8 0 1.5-.5 1.8-1.2l3-7.1c.1-.2.2-.5.2-.7v-2z"/></svg>Like</div>
  <div class="pill" id="b2"><svg viewBox="0 0 24 24"><path d="M14 9V5l7 7-7 7v-4.1c-5 0-8.5 1.6-11 5.1 1-5 4-10 11-11z"/></svg>Share</div>
  <div class="pill sub" id="b3"><svg viewBox="0 0 24 24"><path d="M10 15l5.2-3L10 9v6zm11.6-7.8c.4 1.5.4 4.8.4 4.8s0 3.3-.4 4.8c-.2.8-.9 1.5-1.7 1.7C18.4 19 12 19 12 19s-6.4 0-7.9-.5c-.8-.2-1.5-.9-1.7-1.7C2 15.3 2 12 2 12s0-3.3.4-4.8c.2-.8.9-1.5 1.7-1.7C5.6 5 12 5 12 5s6.4 0 7.9.5c.8.2 1.5.9 1.7 1.7z"/></svg>Subscribe</div>
</div>
<div id="vig"></div>
<script>
const CARD=window.CARD||{title:'Morning by Morning',label:'Book 11 of 12 · November',amazon:'x'};
document.getElementById('bookTitle').textContent=CARD.title;
document.getElementById('coverTag').textContent=CARD.label;
if(!CARD.amazon){document.getElementById('t1').remove();
  document.getElementById('eyebrow').textContent='Read along every night';
  document.getElementById('lead').innerHTML='A story a day that lines up with <b>Come, Follow Me</b>.<br>Read them all in the app or on our website.';}
let seed=11;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}
const st=document.getElementById('stars');const stars=[];
for(let i=0;i<90;i++){const s=document.createElement('div');s.className='star';const r=rnd()*2.2+.6;
 s.style.cssText=`left:${rnd()*1920}px;top:${rnd()*1080}px;width:${r}px;height:${r}px`;st.appendChild(s);stars.push([s,.25+rnd()*.5,rnd()*6.28,0.6+rnd()*1.2])}
function ease(x){x=Math.max(0,Math.min(1,x));return 1-Math.pow(1-x,3)}
let KEY=[];function show(id,t0,t,dy=24){const e=document.getElementById(id);const u=ease((t-t0)/0.7);KEY.push(u.toFixed(3));e.style.opacity=u;e.style.transform=`translateY(${(1-u)*dy}px)`}
window.render=function(t,C){KEY=[Math.floor(t*3)];
  const ts=Math.floor(t*3)/3; stars.forEach(([s,o,ph,f])=>s.style.opacity=o*(0.7+0.3*Math.sin(ph+ts*f)));
  show('cover',0.1,t,30); show('coverTag',0.5,t,12); show('right',C.amazon-0.3,t);
  if(document.getElementById('t1'))show('t1',C.amazon+1.0,t); show('t2',C.app+0.2,t); show('t3',C.app+2.6,t);
  show('links',C.links-0.2,t,12); show('bar',C.like-0.3,t);
  const pulse=(id,t0)=>{const k=Math.max(0,Math.sin(Math.min(1,Math.max(0,(t-t0)/0.6))*Math.PI));KEY.push(k.toFixed(3));document.getElementById(id).style.transform=`scale(${1+0.12*k})`};
  pulse('b1',C.like+1.2); pulse('b2',C.like+2.6); pulse('b3',C.like+4.3);
  const cv=document.getElementById('cover'); const rt=Math.round((-1.2+0.4*Math.sin(t*0.5))*50)/50; KEY.push(rt); cv.style.transform+=` rotate(${rt}deg)`;
  return KEY.join(',');
};
</script></body></html>
